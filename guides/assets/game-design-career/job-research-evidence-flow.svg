<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="공식 공고와 표본 경계가 역량 gap, minimum repair, 사람 검토를 거쳐 current evidence artifact로 이어지는 흐름." aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">공식 공고와 표본 경계가 역량 gap, minimum repair, 사람 검토를 거쳐 current evidence artifact로 이어지는 흐름.</title>
  <desc id="desc">공식 공고 record, sample boundary, competency gap과 human review가 dated job evidence artifact로 이어집니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="#1f6fb2"/><text x="70" y="76" fill="#1f2733" font-size="42" font-weight="700">공고 표본은 날짜가 있는 역할 근거로만 사용합니다</text><text x="70" y="112" fill="#5b6675" font-size="20">반복 신호는 추론이며, 표본 밖의 일반화와 stale record 사용을 막습니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="#f4f8fc" stroke="#d6e0ec"/>
  <g aria-label="읽기 순서 1: 공식 공고"><rect x="100" y="330" width="240" height="180" rx="12" fill="#e8f1fb" stroke="#1f6fb2" stroke-width="1.5"/><text x="120" y="375" fill="#124267" font-size="21" font-weight="700" dominant-baseline="central">공식 공고</text><text x="120" y="410" fill="#5b6675" font-size="16" dominant-baseline="central">sourceUrl · region</text><text x="120" y="438" fill="#5b6675" font-size="16" dominant-baseline="central">retrievalDate</text><text x="120" y="480" fill="#1f6fb2" font-size="14">status: observed</text></g><path d="M350 420H390" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 표본 경계"><rect x="400" y="330" width="240" height="180" rx="12" fill="#ecebfb" stroke="#534ab7" stroke-width="1.5"/><text x="420" y="375" fill="#3c3489" font-size="21" font-weight="700" dominant-baseline="central">표본 경계</text><text x="420" y="410" fill="#5b6675" font-size="16" dominant-baseline="central">sample boundary</text><text x="420" y="438" fill="#5b6675" font-size="16" dominant-baseline="central">reviewAfter</text><text x="420" y="480" fill="#534ab7" font-size="14">status: bounded</text></g><path d="M650 420H690" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 역량 gap"><rect x="700" y="330" width="240" height="180" rx="12" fill="#e7f5ef" stroke="#0f7a5f" stroke-width="1.5"/><text x="720" y="375" fill="#085041" font-size="21" font-weight="700" dominant-baseline="central">역량 gap</text><text x="720" y="410" fill="#5b6675" font-size="16" dominant-baseline="central">required · proof</text><text x="720" y="438" fill="#5b6675" font-size="16" dominant-baseline="central">minimum repair</text><text x="720" y="480" fill="#0f7a5f" font-size="14">status: proposed</text></g><path d="M950 420H990" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: 사람 검토"><rect x="1000" y="330" width="240" height="180" rx="12" fill="#fff3df" stroke="#a75b00" stroke-width="1.5"/><text x="1120" y="366" text-anchor="middle" fill="#814600" font-size="20" font-weight="700" dominant-baseline="central">표본 검토</text><rect x="1030" y="392" width="180" height="38" rx="19" fill="#a75b00"/><text x="1120" y="411" text-anchor="middle" fill="#fff" font-size="15" dominant-baseline="central">Research · Portfolio</text><text x="1120" y="458" text-anchor="middle" fill="#5b6675" font-size="16" dominant-baseline="central">approve / revise</text><text x="1020" y="480" fill="#a75b00" font-size="14">status: pending</text></g><path d="M1120 522V592" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 5: 공고 근거 artifact"><rect x="350" y="604" width="890" height="110" rx="12" fill="#fff" stroke="#d6e0ec" stroke-width="1.5"/><text x="400" y="648" fill="#1f2733" font-size="23" font-weight="700" dominant-baseline="central">job-posting-evidence artifact</text><text x="400" y="684" fill="#5b6675" font-size="18" dominant-baseline="central">fresh records · competency matrix · project brief</text><text x="1070" y="666" fill="#0f7a5f" font-size="15">fresh 후 진행</text></g>
</svg>
