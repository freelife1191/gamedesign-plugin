<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">경력 단계의 다음 경로는 fresh proof와 사람 결정으로 정합니다</title>
  <desc id="desc">Flow archetype. 현재 단계, 실제 project event, 전환 readiness와 사람 결정이 junior growth review와 renderer-neutral export preparation으로 이어집니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/>
  <text x="70" y="76" class="title" font-size="42">경력 단계의 다음 경로는 fresh proof와 사람 결정으로 정합니다</text><text x="70" y="112" class="body" font-size="20">성장과 전환을 보장된 progression처럼 표현하지 않고, 재평가 가능한 선택지로 남깁니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 현재 단계"><rect x="100" y="330" width="240" height="180" rx="12" class="card blue"/><circle cx="145" cy="395" r="30" fill="#d8eafa"/><text x="185" y="375" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">현재 단계</text><text x="185" y="410" class="body" font-size="16" dominant-baseline="central">goal · constraint</text><text x="185" y="438" class="body" font-size="16" dominant-baseline="central">fresh source</text><text x="120" y="480" fill="#1f6fb2" font-size="14">status: observed</text></g>
  <path d="M350 420H390" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 실제 project event"><rect x="400" y="330" width="240" height="180" rx="12" class="card purple"/><circle cx="445" cy="395" r="30" fill="#e4e2fa"/><text x="485" y="375" class="card-title" fill="#3c3489" font-size="21" dominant-baseline="central">실제 event</text><text x="485" y="410" class="body" font-size="16" dominant-baseline="central">proof artifact</text><text x="485" y="438" class="body" font-size="16" dominant-baseline="central">feedback cadence</text><text x="420" y="480" fill="#534ab7" font-size="14">status: recorded</text></g>
  <path d="M650 420H690" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 전환 readiness"><rect x="700" y="330" width="240" height="180" rx="12" class="card green"/><circle cx="745" cy="395" r="30" fill="#d8f0e5"/><text x="785" y="375" class="card-title" fill="#085041" font-size="21" dominant-baseline="central">전환 상태</text><text x="785" y="410" class="body" font-size="16" dominant-baseline="central">gap · alternative</text><text x="785" y="438" class="body" font-size="16" dominant-baseline="central">verification task</text><text x="720" y="480" fill="#0f7a5f" font-size="14">status: provisional</text></g>
  <path d="M950 420H990" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: 사람 결정"><rect x="1000" y="330" width="240" height="180" rx="12" class="card amber"/><text x="1120" y="366" text-anchor="middle" class="card-title" fill="#814600" font-size="20" dominant-baseline="central">경로 gate</text><rect x="1030" y="392" width="180" height="38" rx="19" fill="#a75b00"/><text x="1120" y="411" text-anchor="middle" class="on-accent" font-size="15" dominant-baseline="central">Growth · Export</text><text x="1120" y="458" text-anchor="middle" class="body" font-size="16" dominant-baseline="central">approve / defer</text><text x="1020" y="480" fill="#a75b00" font-size="14">status: pending</text></g>
  <path d="M1120 522V592" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 5: 성장과 전환 artifact"><rect x="350" y="604" width="890" height="110" rx="12" class="card"/><text x="400" y="648" class="title" font-size="23" dominant-baseline="central">growth and transition artifact</text><text x="400" y="684" class="body" font-size="18" dominant-baseline="central">quarterly review · alternative path · export state</text><text x="1070" y="666" fill="#0f7a5f" font-size="15">review 후 진행</text></g>
</svg>
