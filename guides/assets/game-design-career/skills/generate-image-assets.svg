<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Career 이미지 자산 생성 직접 호출 흐름">
  <title>CA-S04 이미지 생성 호출</title>
  <desc>Career 이미지 자산 생성 직접 호출 흐름</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F7FAFD"/>
  <rect x="52" y="52" width="8" height="138" rx="4" fill="#1F6FB2"/>
  <text x="88" y="86" fill="#1F6FB2" font-size="18" font-weight="700">CA-S04 · CAREER SKILL</text>
  <text x="88" y="148" fill="#1F2733" font-size="54" font-weight="700">CA-S04 이미지 생성 호출</text>
  <text x="88" y="192" fill="#5B6675" font-size="24" textLength="1220" lengthAdjust="spacingAndGlyphs">selection receipt와 asset ID을 받아 finite image job 처리를 수행하고 조건부 다음 경로를 남깁니다.</text>
  <rect x="52" y="274" width="1296" height="356" rx="28" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="2"/>
  <path d="M 312 450 L 323 492" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 567 492 L 578 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 822 450 L 833 492" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 1077 492 L 1088 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <g aria-label="읽기 순서 1: 직접 호출 조건">
    <rect x="80" y="342" width="220" height="216" rx="18" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="108" y="370" width="52" height="32" rx="16" fill="#1F6FB2"/>
    <text x="134" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
      <text x="108" y="438" fill="#124267" font-size="22" font-weight="700">직접 호출 조건</text>
      <text x="108" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">선택 receipt의 finite job</text>
  </g>
  <g aria-label="읽기 순서 2: 근거 입력">
    <rect x="335" y="384" width="220" height="216" rx="18" fill="#ECEBFB" stroke="#534AB7" stroke-width="2"/>
    <rect x="363" y="412" width="52" height="32" rx="16" fill="#534AB7"/>
    <text x="389" y="434" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
      <text x="363" y="480" fill="#3C3489" font-size="22" font-weight="700">근거 입력</text>
      <text x="363" y="542" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">selection receipt와 asset ID</text>
  </g>
  <g aria-label="읽기 순서 3: 스킬 소유 작업">
    <rect x="590" y="342" width="220" height="216" rx="18" fill="#E7F5EF" stroke="#0F7A5F" stroke-width="2"/>
    <rect x="618" y="370" width="52" height="32" rx="16" fill="#0F7A5F"/>
    <text x="644" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
      <text x="618" y="438" fill="#085041" font-size="22" font-weight="700">스킬 소유 작업</text>
      <text x="618" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">finite image job 처리</text>
  </g>
  <g aria-label="읽기 순서 4: 출력 ID">
    <rect x="845" y="384" width="220" height="216" rx="18" fill="#FFF3DF" stroke="#A75B00" stroke-width="2"/>
    <rect x="873" y="412" width="52" height="32" rx="16" fill="#A75B00"/>
    <text x="899" y="434" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
      <text x="873" y="480" fill="#814600" font-size="22" font-weight="700">출력 ID</text>
      <text x="873" y="542" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">image-generation-result</text>
      <text x="873" y="558" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">image-generation-provenance</text>
  </g>
  <g aria-label="읽기 순서 5: 다음 조건">
    <rect x="1100" y="342" width="220" height="216" rx="18" fill="#FCECF3" stroke="#A52B5D" stroke-width="2"/>
    <rect x="1128" y="370" width="52" height="32" rx="16" fill="#A52B5D"/>
    <text x="1154" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">5</text>
      <text x="1128" y="438" fill="#7A1942" font-size="22" font-weight="700">다음 조건</text>
      <text x="1128" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">review-image-assets</text>
  </g>
  <rect x="52" y="636" width="1296" height="60" rx="14" fill="#F2F6FB" stroke="#C9D8E8" stroke-width="1"/>
  <text x="72" y="649" fill="#354152" font-size="8" textLength="610" lengthAdjust="spacingAndGlyphs">skill / reviewer: generate-image-assets / visual-asset-reviewer</text>
  <text x="72" y="662" fill="#354152" font-size="8" textLength="610" lengthAdjust="spacingAndGlyphs">trigger / input: 선택 receipt의 finite job / selection receipt와 asset ID</text>
  <text x="72" y="675" fill="#354152" font-size="7" textLength="610" lengthAdjust="spacingAndGlyphs">work / outputs: finite image job 처리 / image-generation-result · image-generation-provenance</text>
  <text x="72" y="688" fill="#354152" font-size="8" textLength="610" lengthAdjust="spacingAndGlyphs">boundary: named human approval 전에는 final binding하지 않음</text>
  <text x="710" y="649" fill="#354152" font-size="8">routes: review 필요→review-image-assets</text>
  <text x="710" y="662" fill="#354152" font-size="7" textLength="618" lengthAdjust="spacingAndGlyphs">failure / preserve: provider 또는 selection receipt 부재 / prompt·placeholder와 lifecycle</text>
  <text x="710" y="675" fill="#354152" font-size="7" textLength="618" lengthAdjust="spacingAndGlyphs">confirm / resume: visual-asset-reviewer가 provider routing과 실제 사용자 decision을 확인 / stable asset ID에서 재개</text>
  <text x="710" y="688" fill="#354152" font-size="8">next condition: review가 필요할 때만</text>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="792" fill="#1F2733" font-size="22">정확한 output ID와 조건부 route, stable asset ID에서 재개 조건을 기록합니다.</text>
  <text x="84" y="821" fill="#354152" font-weight="500" font-size="8">next condition: review가 필요할 때만</text>
</svg>
