<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Career 이미지 자산 검토 직접 호출 흐름" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>CA-S13 이미지 검토 호출</title>
  <desc>Career 이미지 자산 검토 직접 호출 흐름. stable asset ID와 decisionReceipt을 받아 lifecycle transition 검토를 수행하고 조건부 다음 경로를 남깁니다.. steps[1].stage: trigger; steps[1].label: 직접 호출 조건; steps[1].detail: CA-S13 호출 조건; steps[2].stage: evidence input; steps[2].label: 근거 입력; steps[2].detail: CA-S13 입력 확인; steps[3].stage: skill-owned work; steps[3].label: 스킬 소유 작업; steps[3].detail: CA-S13 작업 수행; steps[4].stage: output; steps[4].label: 출력 ID; steps[4].detail: CA-S13 출력 기록; steps[5].stage: next route; steps[5].label: 다음 조건; steps[5].detail: CA-S13 재개 경로; semantic.skill: review-image-assets; semantic.trigger: 한 stable asset transition; semantic.required_input: stable asset ID와 decisionReceipt; semantic.owned_work: lifecycle transition 검토; semantic.outputs[1]: image-asset-review; semantic.outputs[2]: lifecycle-receipt; semantic.reviewer: named-human-reviewer; semantic.boundary: agent finding은 승인이나 state transition이 아님; semantic.failure: actual decision·reviewer·reviewedAt·evidence·rightsDecision 누락; semantic.preserve: 기존 state와 finding; semantic.human_confirmation: named-human-reviewer가 누락 evidence와 targetState를 확인; semantic.resume: 같은 stable ID transition에서 재개; semantic.next_condition: document-approved일 때만; semantic.next_route: export-career-documents; semantic.next_routes[1].condition: document-approved; semantic.next_routes[1].target: export-career-documents</desc>
