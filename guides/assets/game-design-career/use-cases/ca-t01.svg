<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="시스템 기획 입문 학생의 증거 과제와 학습 경로" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>CA-T01 시스템 기획 입문 학생</title>
  <desc>시스템 기획 입문 학생의 증거 과제와 학습 경로. 입문 학생가 상태 전이와 예외 표를 잠금 해제 규칙표에 쓰고 사람 검토 뒤 재개하는 경로입니다.. steps[1].stage: evidence input; steps[1].label: 시스템 기획 입문 학생; steps[1].detail: 상태 전이와 예외 표; steps[2].stage: owned work; steps[2].label: 잠금 해제 규칙표; steps[2].detail: 규칙표 proof 작성; steps[3].stage: human review; steps[3].label: CA-T01 검토 owner; steps[3].detail: 질문 뒤 범위 확인; steps[4].stage: boundary; steps[4].label: 실패·보존 경계; steps[4].detail: 합격을 보장하지 않음; steps[5].stage: output / next route; steps[5].label: 확인 후 재개; steps[5].detail: CA-T02 또는 CA-T03; semantic.role: 시스템 기획; semantic.stage: 입문 학생; semantic.evidence: 상태 전이와 예외 표; semantic.use: 잠금 해제 규칙표; semantic.owned_work: 규칙표 proof 작성; semantic.human_review: 시스템 기획 멘토; semantic.boundary: 합격을 보장하지 않음; semantic.failure: 상태 전이 또는 예외 표가 관찰되지 않으면 claim을 보류합니다.; semantic.preserve: 상태 전이, 예외 표, 규칙표와 반례.; semantic.human_confirmation: 시스템 기획 멘토가 규칙과 예외의 범위를 읽고 질문을 남깁니다.; semantic.resume: 확인된 잠금 해제 기능의 규칙표에서 재개합니다.; semantic.next_condition: 시스템 기획 멘토 확인 뒤 조건에 맞는 route로 이동; semantic.next_route: CA-T02 또는 CA-T03; semantic.next_routes[1].condition: 잠금 해제 규칙표 proof가 확인됨; semantic.next_routes[1].target: CA-T02; semantic.next_routes[2].condition: 상태 전이와 예외 표 보강이 필요함; semantic.next_routes[2].target: CA-T03; semantic.outputs[1]: game-design-role-map; semantic.outputs[2]: competency-matrix; semantic.outputs[3]: learning-roadmap</desc>
