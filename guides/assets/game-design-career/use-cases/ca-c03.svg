<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="현재 채용공고의 근거와 표본 경계를 기록하는 흐름">
  <title>CA-C03 현재 채용공고 조사</title>
  <desc>현재 채용공고의 근거와 표본 경계를 기록하는 흐름</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F7FAFD"/>
  <rect x="52" y="52" width="8" height="138" rx="4" fill="#1F6FB2"/>
  <text x="88" y="86" fill="#1F6FB2" font-size="18" font-weight="700">CA-C03 · CAREER CASE</text>
  <text x="88" y="148" fill="#1F2733" font-size="54" font-weight="700">CA-C03 현재 채용공고 조사</text>
  <text x="88" y="192" fill="#5B6675" font-size="24" textLength="1220" lengthAdjust="spacingAndGlyphs">공식 공고와 retrievalDate를 표본·요건 정규화로 정리해 검토 가능한 경로를 만듭니다.</text>
  <rect x="52" y="274" width="1296" height="356" rx="28" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="2"/>
  <path d="M 312 450 L 323 474" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 567 474 L 578 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 822 450 L 833 474" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 1077 474 L 1088 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <g aria-label="읽기 순서 1: 증거 입력">
    <rect x="80" y="342" width="220" height="216" rx="18" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="108" y="370" width="52" height="32" rx="16" fill="#1F6FB2"/>
    <text x="134" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
      <text x="108" y="438" fill="#124267" font-size="22" font-weight="700">증거 입력</text>
      <text x="108" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">공식 공고와 retrievalDate</text>
  </g>
  <g aria-label="읽기 순서 2: 소유 작업">
    <rect x="335" y="366" width="220" height="216" rx="18" fill="#ECEBFB" stroke="#534AB7" stroke-width="2"/>
    <rect x="363" y="394" width="52" height="32" rx="16" fill="#534AB7"/>
    <text x="389" y="416" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
      <text x="363" y="462" fill="#3C3489" font-size="22" font-weight="700">소유 작업</text>
      <text x="363" y="524" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">표본·요건 정규화</text>
  </g>
  <g aria-label="읽기 순서 3: 사람 검토">
    <rect x="590" y="342" width="220" height="216" rx="18" fill="#E7F5EF" stroke="#0F7A5F" stroke-width="2"/>
    <rect x="618" y="370" width="52" height="32" rx="16" fill="#0F7A5F"/>
    <text x="644" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
      <text x="618" y="438" fill="#085041" font-size="22" font-weight="700">사람 검토</text>
      <text x="618" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">career reviewer</text>
  </g>
  <g aria-label="읽기 순서 4: 경계 확인">
    <rect x="845" y="366" width="220" height="216" rx="18" fill="#FFF3DF" stroke="#A75B00" stroke-width="2"/>
    <rect x="873" y="394" width="52" height="32" rx="16" fill="#A75B00"/>
    <text x="899" y="416" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
      <text x="873" y="462" fill="#814600" font-size="22" font-weight="700">경계 확인</text>
      <text x="873" y="524" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">stale evidence는 재검색</text>
  </g>
  <g aria-label="읽기 순서 5: 출력·다음 경로">
    <rect x="1100" y="342" width="220" height="216" rx="18" fill="#FCECF3" stroke="#A52B5D" stroke-width="2"/>
    <rect x="1128" y="370" width="52" height="32" rx="16" fill="#A52B5D"/>
    <text x="1154" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">5</text>
      <text x="1128" y="438" fill="#7A1942" font-size="22" font-weight="700">출력·다음 경로</text>
      <text x="1128" y="500" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">job-posting-evidence</text>
      <text x="1128" y="516" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">game-design-role-map</text>
  </g>
  <rect x="52" y="636" width="1296" height="60" rx="14" fill="#F2F6FB" stroke="#C9D8E8" stroke-width="1"/>
  <text x="72" y="649" fill="#354152" font-size="8">review: career reviewer</text>
  <text x="72" y="662" fill="#354152" font-size="8">evidence: 공식 공고와 retrievalDate</text>
  <text x="710" y="649" fill="#354152" font-size="8" textLength="618" lengthAdjust="spacingAndGlyphs">outputs: job-posting-evidence · game-design-role-map</text>
  <text x="710" y="662" fill="#354152" font-size="8">next: CA-C04 또는 CA-C08</text>
  <text x="710" y="675" fill="#354152" font-size="8">boundary: stale evidence는 재검색</text>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="792" fill="#1F2733" font-size="22">검토 가능한 결과를 남기고 CA-C04 또는 CA-C08 조건을 확인합니다.</text>
  <text x="84" y="821" fill="#354152" font-weight="500" font-size="7" textLength="1232" lengthAdjust="spacingAndGlyphs">review → boundary → next: career reviewer → stale evidence는 재검색 → CA-C04 또는 CA-C08</text>
</svg>
