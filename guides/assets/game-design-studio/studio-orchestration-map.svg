<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">Studio는 하나의 Canonical Artifact에서 도메인과 승인 gate를 조정합니다</title>
  <desc id="desc">Topology component archetype. orchestrate-game-design-project가 quality profile, player experience, systems, review와 human approval을 Canonical Artifact 중심으로 연결합니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="76" class="title" font-size="36">Studio는 Canonical Artifact로 도메인과 승인 gate를 조정합니다</text><text x="70" y="112" class="body" font-size="20">UX·접근성 route는 시스템과 품질 검토에 직접 연결되며, missing evidence는 pending으로 남습니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 오케스트레이터"><rect x="540" y="245" width="320" height="135" rx="12" class="card purple"/><text x="700" y="292" text-anchor="middle" class="card-title" fill="#3c3489" font-size="18" dominant-baseline="central">orchestrate-game-design-project</text><text x="700" y="325" text-anchor="middle" class="body" font-size="17" dominant-baseline="central">route · blocker · next owner</text><text x="570" y="355" fill="#534ab7" font-size="14">status: draft</text></g>
  <path d="M700 392V440" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: Canonical Artifact"><rect x="470" y="450" width="460" height="145" rx="14" class="card green" stroke-width="2"/><text x="700" y="495" text-anchor="middle" class="card-title" fill="#085041" font-size="25" dominant-baseline="central">content.md · Canonical Artifact</text><text x="700" y="530" text-anchor="middle" class="body" font-size="18" dominant-baseline="central">evidence · decisions · assets · pending gates</text><text x="500" y="565" fill="#0f7a5f" font-size="14">status: pending until external receipts</text></g>
  <path d="M460 522H380" class="line" marker-end="url(#arrow)"/><path d="M940 522H1020" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: UX와 접근성"><rect x="100" y="440" width="270" height="165" rx="12" class="card blue"/><text x="125" y="485" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">player experience</text><text x="125" y="520" class="body" font-size="16" dominant-baseline="central">critical action · recovery</text><text x="125" y="550" class="body" font-size="16" dominant-baseline="central">accessibility evidence</text><text x="125" y="580" fill="#1f6fb2" font-size="14">status: pending</text></g>
  <g aria-label="읽기 순서 4: 시스템과 품질"><rect x="1030" y="440" width="270" height="165" rx="12" class="card blue"/><text x="1055" y="485" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">systems · quality</text><text x="1055" y="520" class="body" font-size="16" dominant-baseline="central">state · rule · checklist</text><text x="1055" y="550" class="body" font-size="16" dominant-baseline="central">reviewable sections</text><text x="1055" y="580" fill="#1f6fb2" font-size="14">status: pending</text></g>
  <path d="M700 607V660" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 5: 검토와 사람 결정"><rect x="340" y="670" width="720" height="82" rx="12" class="card amber"/><text x="390" y="703" class="card-title" fill="#814600" font-size="21" dominant-baseline="central">review-game-design → named human approval</text><text x="390" y="730" class="body" font-size="17" dominant-baseline="central">finding, minimum fix, owner와 blocked decision을 보존</text></g>
</svg>
