<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">규칙·상태·예외를 함께 검토하면 구현 가능한 기능 명세가 됩니다</title>
  <desc id="desc">Flow archetype. design-game-systems가 입력과 precondition에서 state, exception precedence, recovery와 review finding으로 가는 관계를 표시합니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--purple)"/><text x="70" y="76" class="title" font-size="40">규칙·상태·예외를 함께 검토하면 구현 가능한 기능 명세가 됩니다</text><text x="70" y="112" class="body" font-size="20">normal path만 승인하지 않고 precedence와 recovery를 test case까지 연결합니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 입력과 조건"><rect x="100" y="310" width="240" height="190" rx="12" class="card blue"/><text x="125" y="360" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">input · guard</text><text x="125" y="400" class="body" font-size="17" dominant-baseline="central">authoritative data ID</text><text x="125" y="430" class="body" font-size="17" dominant-baseline="central">precondition</text><text x="125" y="470" fill="#1f6fb2" font-size="14">status: draft</text></g><path d="M350 405H390" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 규칙과 상태"><rect x="400" y="310" width="240" height="190" rx="12" class="card purple"/><text x="425" y="360" class="card-title" fill="#3c3489" font-size="21" dominant-baseline="central">system rule</text><text x="425" y="400" class="body" font-size="17" dominant-baseline="central">design-game-systems</text><text x="425" y="430" class="body" font-size="17" dominant-baseline="central">state transition</text><text x="425" y="470" fill="#534ab7" font-size="14">status: pending</text></g><path d="M650 405H690" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 예외 우선순위"><rect x="700" y="310" width="240" height="190" rx="12" class="card amber"/><text x="725" y="360" class="card-title" fill="#814600" font-size="21" dominant-baseline="central">exception order</text><text x="725" y="400" class="body" font-size="17" dominant-baseline="central">precedence · concurrency</text><text x="725" y="430" class="body" font-size="17" dominant-baseline="central">rule-exception-matrix</text><text x="725" y="470" fill="#a75b00" font-size="14">status: blocked 가능</text></g><path d="M950 405H990" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: 복구와 검토"><rect x="1000" y="310" width="240" height="190" rx="12" class="card green"/><text x="1025" y="360" class="card-title" fill="#085041" font-size="21" dominant-baseline="central">recovery · review</text><text x="1025" y="400" class="body" font-size="17" dominant-baseline="central">UI feedback · test case</text><text x="1025" y="430" class="body" font-size="17" dominant-baseline="central">review-game-design</text><text x="1025" y="470" fill="#0f7a5f" font-size="14">status: pending</text></g>
  <path d="M1120 512V582H820" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="920" y="566" class="body" font-size="15">failure → recovery feedback</text>
  <g aria-label="읽기 순서 5: 명세 artifact"><rect x="260" y="620" width="880" height="94" rx="12" class="card"/><text x="310" y="658" class="title" font-size="22" dominant-baseline="central">system-specification/content.md</text><text x="310" y="691" class="body" font-size="18" dominant-baseline="central">runtime mapping과 direct evidence를 갖춘 reviewable mechanic contract</text></g>
</svg>
