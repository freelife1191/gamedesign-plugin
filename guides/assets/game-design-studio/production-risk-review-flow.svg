<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">제작 위험은 검토와 사람 결정 뒤에만 내보내기 준비로 이동합니다</title>
  <desc id="desc">Flow archetype. production-scope-risk artifact가 review finding과 named human decision을 거쳐 renderer-neutral export manifest로 가는 승인 경계입니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--amber)"/><text x="70" y="76" class="title" font-size="37">제작 위험은 검토와 결정 뒤에만 내보내기 준비로 갑니다</text><text x="70" y="112" class="body" font-size="20">파일 존재나 renderer 실행은 approval이 아니며, MD·PDF·DOCX·PPTX 상태는 독립적으로 보존됩니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 제작 범위"><rect x="100" y="320" width="240" height="180" rx="12" class="card blue"/><text x="125" y="365" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">production scope</text><text x="125" y="402" class="body" font-size="16" dominant-baseline="central">capacity · dependency</text><text x="125" y="432" class="body" font-size="16" dominant-baseline="central">kill criteria · hard No-Go</text><text x="125" y="470" fill="#1f6fb2" font-size="14">status: draft</text></g><path d="M350 410H390" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 검토 finding"><rect x="400" y="320" width="240" height="180" rx="12" class="card purple"/><text x="425" y="365" class="card-title" fill="#3c3489" font-size="20" dominant-baseline="central">review-game-design</text><text x="425" y="402" class="body" font-size="16" dominant-baseline="central">evidence · severity</text><text x="425" y="432" class="body" font-size="16" dominant-baseline="central">minimum fix · owner</text><text x="425" y="470" fill="#534ab7" font-size="14">status: pending</text></g><path d="M650 410H690" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 사람 결정"><rect x="700" y="320" width="240" height="180" rx="12" class="card amber"/><text x="820" y="360" text-anchor="middle" class="card-title" fill="#814600" font-size="21" dominant-baseline="central">decision gate</text><rect x="738" y="390" width="164" height="36" rx="18" fill="#a75b00"/><text x="820" y="408" text-anchor="middle" class="on-accent" font-size="15" dominant-baseline="central">김서윤 · owner</text><text x="820" y="455" text-anchor="middle" class="body" font-size="16" dominant-baseline="central">accept / revise / hold</text><text x="725" y="480" fill="#a75b00" font-size="14">status: pending</text></g><path d="M950 410H990" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: 내보내기 준비"><rect x="1000" y="320" width="240" height="180" rx="12" class="card green"/><text x="1025" y="365" class="card-title" fill="#085041" font-size="20" dominant-baseline="central">export preparation</text><text x="1025" y="402" class="body" font-size="16" dominant-baseline="central">MD · PDF · DOCX · PPTX</text><text x="1025" y="432" class="body" font-size="16" dominant-baseline="central">renderer-neutral manifest</text><text x="1025" y="470" fill="#0f7a5f" font-size="14">pending / blocked / unavailable</text></g>
  <g aria-label="읽기 순서 5: fallback"><rect x="265" y="640" width="870" height="82" rx="12" class="card"/><text x="315" y="674" class="title" font-size="21" dominant-baseline="central">renderer fallback</text><text x="315" y="704" class="body" font-size="17" dominant-baseline="central">Chromium 또는 format renderer가 없으면 Canonical Artifact와 existing output을 보존합니다.</text></g>
</svg>
