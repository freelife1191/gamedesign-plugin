<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">퀘스트 선택은 시스템 상태와 제작 범위를 함께 통과해야 합니다</title>
  <desc id="desc">Flow archetype. narrative-quest-npc artifact가 quest stage, system state, production risk와 named owner approval으로 연결되는 흐름입니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--green)"/><text x="70" y="76" class="title" font-size="40">퀘스트 선택은 시스템 상태와 제작 범위를 함께 통과해야 합니다</text><text x="70" y="112" class="body" font-size="20">rights·consent 또는 production evidence가 없으면 quest 결론은 blocked로 남습니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 퀘스트 의도"><rect x="100" y="320" width="240" height="185" rx="12" class="card blue"/><text x="125" y="366" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">quest intent</text><text x="125" y="404" class="body" font-size="16" dominant-baseline="central">stage · NPC · choice</text><text x="125" y="434" class="body" font-size="16" dominant-baseline="central">narrative boundary</text><text x="125" y="475" fill="#1f6fb2" font-size="14">status: draft</text></g><path d="M350 412H390" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 콘텐츠 계약"><rect x="400" y="320" width="240" height="185" rx="12" class="card purple"/><text x="425" y="366" class="card-title" fill="#3c3489" font-size="20" dominant-baseline="central">design-game-content</text><text x="425" y="404" class="body" font-size="16" dominant-baseline="central">narrative-quest-npc</text><text x="425" y="434" class="body" font-size="16" dominant-baseline="central">outcome · recovery</text><text x="425" y="475" fill="#534ab7" font-size="14">status: pending</text></g><path d="M650 412H690" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 시스템 연결"><rect x="700" y="320" width="240" height="185" rx="12" class="card green"/><text x="725" y="366" class="card-title" fill="#085041" font-size="21" dominant-baseline="central">system state</text><text x="725" y="404" class="body" font-size="16" dominant-baseline="central">condition · reward ID</text><text x="725" y="434" class="body" font-size="16" dominant-baseline="central">failure / recovery</text><text x="725" y="475" fill="#0f7a5f" font-size="14">status: pending</text></g><path d="M950 412H990" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: 제작과 권리"><rect x="1000" y="320" width="240" height="185" rx="12" class="card amber"/><text x="1025" y="366" class="card-title" fill="#814600" font-size="21" dominant-baseline="central">production gate</text><text x="1025" y="404" class="body" font-size="16" dominant-baseline="central">capacity · kill criteria</text><text x="1025" y="434" class="body" font-size="16" dominant-baseline="central">rights · consent</text><text x="1025" y="475" fill="#a75b00" font-size="14">status: blocked / pending</text></g>
  <path d="M1120 517V585" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 5: 사람 결정"><rect x="350" y="620" width="700" height="96" rx="12" class="card"/><text x="400" y="658" class="title" font-size="22" dominant-baseline="central">최유진 · Narrative Owner / 한지훈 · Production Owner</text><text x="400" y="691" class="body" font-size="18" dominant-baseline="central">player choice, production scope, rights evidence를 각각 승인하거나 보류</text></g>
</svg>
