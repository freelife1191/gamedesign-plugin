    <text data-text-role="card-body" x="1128" y="488" text-anchor="start" dominant-baseline="central" fill="#354152" font-size="15" font-weight="400"><tspan x="1128" dy="0">다음</tspan><tspan x="1128" dy="19">artifact로</tspan><tspan x="1128" dy="19">넘깁니다.</tspan></text>
