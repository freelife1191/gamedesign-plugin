    <text x="168" y="392" fill="#124267" font-size="14" font-weight="700">입력</text>
      <text x="108" y="438" fill="#124267" font-size="22" font-weight="700">권위 상태</text>
      <text x="108" y="500" fill="#354152" font-size="18" font-weight="400">state sourc</text>
      <text x="108" y="526" fill="#354152" font-size="18" font-weight="400">e를 정합니다.</text>
  </g>
