  <rect x="52" y="636" width="1296" height="60" rx="14" fill="#F2F6FB" stroke="#C9D8E8" stroke-width="1"/>
  <text x="72" y="650" fill="#354152" font-size="9">specialist: design-game-systems</text>
  <text x="72" y="662" fill="#354152" font-size="9">outputs: system-specification · rule-exception-matrix · data-schema-table-contract</text>
  <text x="72" y="674" fill="#354152" font-size="9">review: review-game-design</text>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="798" fill="#1F2733" font-size="24">authority와 precedence는 engineering 검토 전까지 가정으로 보류합니다.</text>
