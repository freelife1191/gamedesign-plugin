    <text x="933" y="416" fill="#814600" font-size="14" font-weight="700">검토</text>
      <text x="873" y="462" fill="#814600" font-size="22" font-weight="700">설계 검토</text>
      <text x="873" y="524" fill="#354152" font-size="10" textLength="164" lengthAdjust="spacingAndGlyphs">review-game-design</text>
  </g>
  <g aria-label="읽기 순서 5: 데이터 계약">
    <rect x="1100" y="342" width="220" height="216" rx="18" fill="#FCECF3" stroke="#A52B5D" stroke-width="2"/>
    <rect x="1128" y="370" width="52" height="32" rx="16" fill="#A52B5D"/>
