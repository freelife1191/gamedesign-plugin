<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="모바일 수집형 RPG LiveService 콘셉트의 설계 흐름">
  <title>수집 RPG LiveOps 판단</title>
  <desc>모바일 수집형 RPG LiveService 콘셉트의 설계 흐름</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F7FAFD"/>
  <rect x="52" y="52" width="8" height="138" rx="4" fill="#1F6FB2"/>
  <text x="88" y="86" fill="#1F6FB2" font-size="18" font-weight="700">ST-G01 · CONCEPT</text>
  <text x="88" y="148" fill="#1F2733" font-size="54" font-weight="700">수집 RPG LiveOps 판단</text>
  <text x="88" y="192" fill="#5B6675" font-size="24">수집 동기와 경제 실험의 승인 조건을 분기합니다.</text>
  <rect x="52" y="274" width="1296" height="356" rx="28" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="2"/>
  <path d="M 402 450 L 438 408" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 682 408 L 718 492" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 962 492 L 998 408" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <g aria-label="읽기 순서 1: 수집 동기">
    <rect x="170" y="342" width="220" height="216" rx="18" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="198" y="370" width="52" height="32" rx="16" fill="#1F6FB2"/>
    <text x="224" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
      <text x="198" y="438" fill="#124267" font-size="22" font-weight="700">수집 동기</text>
      <text x="198" y="500" fill="#354152" font-size="18" font-weight="400">짧은 세션을 확인합니</text>
      <text x="198" y="526" fill="#354152" font-size="18" font-weight="400">다.</text>
  </g>
  <g aria-label="읽기 순서 2: 경제 가설">
    <rect x="450" y="300" width="220" height="216" rx="18" fill="#ECEBFB" stroke="#534AB7" stroke-width="2"/>
    <rect x="478" y="328" width="52" height="32" rx="16" fill="#534AB7"/>
    <text x="504" y="350" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
      <text x="478" y="396" fill="#3C3489" font-size="22" font-weight="700">경제 가설</text>
      <text x="478" y="458" fill="#354152" font-size="18" font-weight="400">source sink</text>
      <text x="478" y="484" fill="#354152" font-size="18" font-weight="400">를 둡니다.</text>
  </g>
  <g aria-label="읽기 순서 3: guardrail 결정">
    <rect x="730" y="384" width="220" height="216" rx="18" fill="#E7F5EF" stroke="#0F7A5F" stroke-width="2"/>
    <rect x="758" y="412" width="52" height="32" rx="16" fill="#0F7A5F"/>
    <text x="784" y="434" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
      <text x="758" y="480" fill="#085041" font-size="22" font-weight="700">guardrail </text>
      <text x="758" y="510" fill="#085041" font-size="22" font-weight="700">결정</text>
      <text x="758" y="542" fill="#354152" font-size="18" font-weight="400">보호 기준을 비교합니</text>
      <text x="758" y="568" fill="#354152" font-size="18" font-weight="400">다.</text>
  </g>
  <g aria-label="읽기 순서 4: 이벤트 검증">
    <rect x="1010" y="300" width="220" height="216" rx="18" fill="#FFF3DF" stroke="#A75B00" stroke-width="2"/>
    <rect x="1038" y="328" width="52" height="32" rx="16" fill="#A75B00"/>
    <text x="1064" y="350" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
      <text x="1038" y="396" fill="#814600" font-size="22" font-weight="700">이벤트 검증</text>
      <text x="1038" y="458" fill="#354152" font-size="18" font-weight="400">rollback을 봅</text>
      <text x="1038" y="484" fill="#354152" font-size="18" font-weight="400">니다.</text>
  </g>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="798" fill="#1F2733" font-size="24">telemetry와 rollback 기준이 없는 수집 이벤트는 launch 판단으로 올리지 않습니다.</text>
</svg>
