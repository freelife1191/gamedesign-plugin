<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">경제 가설은 보호 지표와 rollback이 있을 때만 LiveOps 실험으로 갑니다</title>
  <desc id="desc">Flow archetype with dashed feedback. economy-balance와 liveops-experiment-event가 source/sink, guardrail, stop, rollback과 human owner approval으로 연결됩니다.</desc>
  <style>svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a75b00;--panel:#f4f8fc}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card{fill:#fff;stroke:var(--hair);stroke-width:1.5}.blue{fill:#e8f1fb;stroke:var(--blue)}.purple{fill:#ecebfb;stroke:var(--purple)}.green{fill:#e7f5ef;stroke:var(--green)}.amber{fill:#fff3df;stroke:var(--amber)}.line{stroke:#5b6675;stroke-width:2;fill:none}.card-title{font-weight:700}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--bg)"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--green)"/><text x="70" y="76" class="title" font-size="36">경제 가설은 보호 지표와 rollback 뒤에 LiveOps 실험으로 갑니다</text><text x="70" y="112" class="body" font-size="20">price·odds·pity 근거나 rollback capability가 없으면 experiment는 hard No-Go입니다.</text>
  <rect x="40" y="180" width="1320" height="620" rx="20" fill="var(--panel)" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 가치 흐름"><rect x="100" y="320" width="240" height="180" rx="12" class="card blue"/><text x="125" y="365" class="card-title" fill="#124267" font-size="21" dominant-baseline="central">source · sink</text><text x="125" y="402" class="body" font-size="16" dominant-baseline="central">resource · inventory</text><text x="125" y="432" class="body" font-size="16" dominant-baseline="central">policy date · evidence</text><text x="125" y="470" fill="#1f6fb2" font-size="14">status: draft</text></g><path d="M350 410H390" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 경제 명세"><rect x="400" y="320" width="240" height="180" rx="12" class="card purple"/><text x="425" y="365" class="card-title" fill="#3c3489" font-size="20" dominant-baseline="central">economy-balance</text><text x="425" y="402" class="body" font-size="16" dominant-baseline="central">price · odds · pity</text><text x="425" y="432" class="body" font-size="16" dominant-baseline="central">player consequence</text><text x="425" y="470" fill="#534ab7" font-size="14">status: pending</text></g><path d="M650 410H690" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 안전한 실험"><rect x="700" y="320" width="240" height="180" rx="12" class="card amber"/><text x="725" y="365" class="card-title" fill="#814600" font-size="20" dominant-baseline="central">LiveOps experiment</text><text x="725" y="402" class="body" font-size="16" dominant-baseline="central">control · guardrail</text><text x="725" y="432" class="body" font-size="16" dominant-baseline="central">stop condition</text><text x="725" y="470" fill="#a75b00" font-size="14">status: pending / blocked</text></g><path d="M950 410H990" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 4: rollback 승인"><rect x="1000" y="320" width="240" height="180" rx="12" class="card green"/><text x="1025" y="365" class="card-title" fill="#085041" font-size="21" dominant-baseline="central">rollback readiness</text><text x="1025" y="402" class="body" font-size="16" dominant-baseline="central">systems · production</text><text x="1025" y="432" class="body" font-size="16" dominant-baseline="central">owner: 정하늘 / 윤태호</text><text x="1025" y="470" fill="#0f7a5f" font-size="14">human approval required</text></g>
  <path d="M1120 512V600H520V520" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="680" y="588" class="body" font-size="16">rollback / recalibrate feedback</text><g aria-label="읽기 순서 5: release boundary"><rect x="390" y="665" width="620" height="58" rx="12" class="card"/><text x="700" y="695" text-anchor="middle" class="body" font-size="18" dominant-baseline="central">hard No-Go는 조건부 승인으로 바꾸지 않습니다.</text></g>
</svg>
