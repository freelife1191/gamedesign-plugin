<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="SVG 인포그래픽 직접 호출 흐름" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>SVG 인포그래픽 호출</title>
  <desc>SVG 인포그래픽 직접 호출 흐름. source-mapped editable SVG와 2× PNG evidence를 만듭니다.. steps[1].stage: trigger; steps[1].label: SVG trigger; steps[1].detail: 구조 관계를 받습니다.; steps[2].stage: 필수 입력; steps[2].label: 관계 구조·근거; steps[2].detail: 필수 값을 둡니다.; steps[3].stage: skill-owned work; steps[3].label: SVG authoring; steps[3].detail: 작업 경계를 수행합니다.; steps[4].stage: output; steps[4].label: editable SVG; steps[4].detail: 정확한 ID를 남깁니다.; steps[5].stage: next route; steps[5].label: 관계 도식화; steps[5].detail: 조건부 handoff입니다.; semantic.skill: svg-infographic; semantic.outputs[1]: editable-svg; semantic.outputs[2]: png-2x; semantic.outputs[3]: render-evidence; semantic.next_routes[1]: visualize-game-design; semantic.required_input: relationship structure + evidence</desc>
