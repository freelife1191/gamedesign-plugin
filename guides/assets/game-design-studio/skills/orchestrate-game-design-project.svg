  <desc>게임 기획 프로젝트 오케스트레이션 직접 호출 흐름. 여러 domain 요청을 bounded route와 completion gate로 나눕니다.. steps[1].stage: trigger; steps[1].label: 복합 trigger; steps[1].detail: 여러 domain을 받습니다.; steps[2].stage: 필수 입력; steps[2].label: Artifact·domain 요청; steps[2].detail: 필수 값을 둡니다.; steps[3].stage: skill-owned work; steps[3].label: route 오케스트레이션; steps[3].detail: 작업 경계를 수행합니다.; steps[4].stage: output; steps[4].label: 게임 브리프; steps[4].detail: 정확한 ID를 남깁니다.; steps[5].stage: next route; steps[5].label: 비전 설계; steps[5].detail: 조건부 handoff입니다.; semantic.skill: orchestrate-game-design-project; semantic.outputs[1]: game-design-brief; semantic.outputs[2]: canonical-artifact; semantic.next_routes[1]: define-game-vision; semantic.next_routes[2]: design-game-systems; semantic.next_routes[3]: design-game-content; semantic.next_routes[4]: design-player-experience; semantic.next_routes[5]: design-game-economy-and-liveops; semantic.next_routes[6]: plan-game-production; semantic.next_routes[7]: review-game-design; semantic.next_routes[8]: visualize-game-design; semantic.next_routes[9]: export-game-design-documents; semantic.required_input: canonical-artifact + domain route requests</desc>
