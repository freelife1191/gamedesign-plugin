<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="게임 제작 계획 직접 호출 흐름">
  <title>제작 계획 직접 호출</title>
  <desc>게임 제작 계획 직접 호출 흐름</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F7FAFD"/>
  <rect x="52" y="52" width="8" height="138" rx="4" fill="#1F6FB2"/>
  <text x="88" y="86" fill="#1F6FB2" font-size="18" font-weight="700">ST-S10 · SKILL</text>
  <text x="88" y="148" fill="#1F2733" font-size="54" font-weight="700">제작 계획 직접 호출</text>
  <text x="88" y="192" fill="#5B6675" font-size="24">vertical slice의 scope·risk·kill criteria를 결정합니다.</text>
  <rect x="52" y="274" width="1296" height="356" rx="28" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="2"/>
  <path d="M 312 450 L 323 492" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 567 492 L 578 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 822 450 L 833 492" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 1077 492 L 1088 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <g aria-label="읽기 순서 1: 제작 trigger">
    <rect x="80" y="342" width="220" height="216" rx="18" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="108" y="370" width="52" height="32" rx="16" fill="#1F6FB2"/>
    <text x="134" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
    <text x="168" y="392" fill="#124267" font-size="14" font-weight="700">trigger</text>
      <text x="108" y="438" fill="#124267" font-size="22" font-weight="700">제작 trigger</text>
      <text x="108" y="500" fill="#354152" font-size="18" font-weight="400">slice 요청을 받</text>
      <text x="108" y="526" fill="#354152" font-size="18" font-weight="400">습니다.</text>
  </g>
  <g aria-label="읽기 순서 2: artifact와 경계">
    <rect x="335" y="384" width="220" height="216" rx="18" fill="#ECEBFB" stroke="#534AB7" stroke-width="2"/>
    <rect x="363" y="412" width="52" height="32" rx="16" fill="#534AB7"/>
    <text x="389" y="434" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
    <text x="423" y="434" fill="#3C3489" font-size="14" font-weight="700">필수 입력</text>
      <text x="363" y="480" fill="#3C3489" font-size="22" font-weight="700">artifact와 </text>
      <text x="363" y="510" fill="#3C3489" font-size="22" font-weight="700">경계</text>
      <text x="363" y="542" fill="#354152" font-size="18" font-weight="400">필수 값을 둡니다.</text>
  </g>
  <g aria-label="읽기 순서 3: 제작 위험 계획">
    <rect x="590" y="342" width="220" height="216" rx="18" fill="#E7F5EF" stroke="#0F7A5F" stroke-width="2"/>
    <rect x="618" y="370" width="52" height="32" rx="16" fill="#0F7A5F"/>
    <text x="644" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
    <text x="678" y="392" fill="#085041" font-size="14" font-weight="700">skill-owned work</text>
      <text x="618" y="438" fill="#085041" font-size="22" font-weight="700">제작 위험 계획</text>
      <text x="618" y="500" fill="#354152" font-size="18" font-weight="400">작업 경계를 수행합니</text>
      <text x="618" y="526" fill="#354152" font-size="18" font-weight="400">다.</text>
  </g>
  <g aria-label="읽기 순서 4: 제작 위험">
    <rect x="845" y="384" width="220" height="216" rx="18" fill="#FFF3DF" stroke="#A75B00" stroke-width="2"/>
    <rect x="873" y="412" width="52" height="32" rx="16" fill="#A75B00"/>
    <text x="899" y="434" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
    <text x="933" y="434" fill="#814600" font-size="14" font-weight="700">output</text>
      <text x="873" y="480" fill="#814600" font-size="22" font-weight="700">제작 위험</text>
      <text x="873" y="542" fill="#354152" font-size="18" font-weight="400">정확한 ID를 남깁니</text>
      <text x="873" y="568" fill="#354152" font-size="18" font-weight="400">다.</text>
  </g>
  <g aria-label="읽기 순서 5: finding 검토">
    <rect x="1100" y="342" width="220" height="216" rx="18" fill="#FCECF3" stroke="#A52B5D" stroke-width="2"/>
    <rect x="1128" y="370" width="52" height="32" rx="16" fill="#A52B5D"/>
    <text x="1154" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">5</text>
    <text x="1188" y="392" fill="#7A1942" font-size="14" font-weight="700">next route</text>
      <text x="1128" y="438" fill="#7A1942" font-size="22" font-weight="700">finding 검토</text>
      <text x="1128" y="500" fill="#354152" font-size="18" font-weight="400">조건부 handoff</text>
      <text x="1128" y="526" fill="#354152" font-size="18" font-weight="400">입니다.</text>
  </g>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="798" fill="#1F2733" font-size="24">production-scope-risk finding은 review route에서 최소 수정으로 검토합니다.</text>
</svg>
