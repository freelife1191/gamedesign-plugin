<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="게임 기획 취업 준비생이 역할 비교, 공고 표본, 역기획, 공백 과제, 증거 검토를 진행하는 경로.">
  <title>게임 기획 취업 준비생 학습 경로</title>
  <desc>게임 기획 취업 준비생이 역할 비교, 공고 표본, 역기획, 공백 과제, 증거 검토를 진행하는 경로.</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F7FAFD"/>
  <rect x="52" y="52" width="8" height="138" rx="4" fill="#1F6FB2"/>
  <text x="88" y="86" fill="#1F6FB2" font-size="18" font-weight="700">AUD-02 · APPLIED</text>
  <text x="88" y="148" fill="#1F2733" font-size="54" font-weight="700">게임 기획 취업 준비생 학습 경로</text>
  <text x="88" y="192" fill="#5B6675" font-size="24">목표 역할과 공개 가능한 관찰 기반 증거를 차례로 연결합니다.</text>
  <rect x="52" y="274" width="1296" height="356" rx="28" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="2"/>
  <path d="M 312 450 L 323 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 567 450 L 578 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 822 450 L 833 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <path d="M 1077 450 L 1088 450" fill="none" stroke="#5B6675" stroke-width="2" stroke-linecap="round" marker-end="url(#open-arrow)"/>
  <g aria-label="읽기 순서 1: 역할 비교">
    <rect x="80" y="342" width="220" height="216" rx="18" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="108" y="370" width="52" height="32" rx="16" fill="#1F6FB2"/>
    <text x="134" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
      <text x="108" y="438" fill="#124267" font-size="22" font-weight="700">역할 비교</text>
      <text x="108" y="500" fill="#354152" font-size="18" font-weight="400">목표 역할을 좁힙니다</text>
      <text x="108" y="526" fill="#354152" font-size="18" font-weight="400">.</text>
  </g>
  <g aria-label="읽기 순서 2: 공고 표본">
    <rect x="335" y="342" width="220" height="216" rx="18" fill="#ECEBFB" stroke="#534AB7" stroke-width="2"/>
    <rect x="363" y="370" width="52" height="32" rx="16" fill="#534AB7"/>
    <text x="389" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
      <text x="363" y="438" fill="#3C3489" font-size="22" font-weight="700">공고 표본</text>
      <text x="363" y="500" fill="#354152" font-size="18" font-weight="400">확인일과 표본 경계를</text>
      <text x="363" y="526" fill="#354152" font-size="18" font-weight="400"> 기록합니다.</text>
  </g>
  <g aria-label="읽기 순서 3: 역기획">
    <rect x="590" y="342" width="220" height="216" rx="18" fill="#E7F5EF" stroke="#0F7A5F" stroke-width="2"/>
    <rect x="618" y="370" width="52" height="32" rx="16" fill="#0F7A5F"/>
    <text x="644" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
      <text x="618" y="438" fill="#085041" font-size="22" font-weight="700">역기획</text>
      <text x="618" y="500" fill="#354152" font-size="18" font-weight="400">관찰과 추론을 분리합</text>
      <text x="618" y="526" fill="#354152" font-size="18" font-weight="400">니다.</text>
  </g>
  <g aria-label="읽기 순서 4: 공백 과제">
    <rect x="845" y="342" width="220" height="216" rx="18" fill="#FFF3DF" stroke="#A75B00" stroke-width="2"/>
    <rect x="873" y="370" width="52" height="32" rx="16" fill="#A75B00"/>
    <text x="899" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
      <text x="873" y="438" fill="#814600" font-size="22" font-weight="700">공백 과제</text>
      <text x="873" y="500" fill="#354152" font-size="18" font-weight="400">학습 공백을 과제로 </text>
      <text x="873" y="526" fill="#354152" font-size="18" font-weight="400">만듭니다.</text>
  </g>
  <g aria-label="읽기 순서 5: 증거 검토">
    <rect x="1100" y="342" width="220" height="216" rx="18" fill="#FCECF3" stroke="#A52B5D" stroke-width="2"/>
    <rect x="1128" y="370" width="52" height="32" rx="16" fill="#A52B5D"/>
    <text x="1154" y="392" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">5</text>
      <text x="1128" y="438" fill="#7A1942" font-size="22" font-weight="700">증거 검토</text>
      <text x="1128" y="500" fill="#354152" font-size="18" font-weight="400">공개 가능한 사례를 </text>
      <text x="1128" y="526" fill="#354152" font-size="18" font-weight="400">점검합니다.</text>
  </g>
  <rect x="52" y="704" width="1296" height="132" rx="20" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="2"/>
  <text x="84" y="758" fill="#124267" font-size="18" font-weight="700">다음 경계</text>
  <text x="84" y="798" fill="#1F2733" font-size="24">포트폴리오 검토자가 검토하고, 승인 전에는 portfolio brief를 지원 결과로 표시하지 않습니다.</text>
</svg>
