<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Studio 결과를 Career 활용 자료로 안전하게 연결하는 흐름</title>
  <desc>연계 요청에서 Studio 원본과 공개 범위를 확인하고 Career 전환 스킬, 결과 검토, 포트폴리오·면접·발표 자료와 사람 승인 또는 보류로 이어집니다.</desc>
  <style>svg{--paper:#F7F8FA;--ink:#2D3142;--muted:#616878;--accent:#EB6C36;--blue:#3972B6;--green:#27866B;--violet:#6258B7;--rose:#B23B68}.title{font-size:42px;font-weight:700;fill:var(--ink)}.sub{font-size:19px;fill:var(--muted)}.node-title{font-size:20px;font-weight:700}.node-body{font-size:16px;fill:var(--muted)}.caption{font-size:16px;fill:var(--muted)}.footer{font-size:17px;font-weight:600;fill:var(--ink)}.edge{fill:none;stroke:#667386;stroke-width:3;marker-end:url(#arrow)}.resume{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-accent)}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#667386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EB6C36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--paper)"/><text x="62" y="76" class="title">Studio 결과는 공개 범위를 확인한 뒤 Career 자료로 이어집니다</text><text x="62" y="114" class="sub">원본을 바꾸지 않고 공개 가능한 판단과 검증만 포트폴리오·면접·발표 자료로 전환합니다.</text>
  <rect x="48" y="176" width="1304" height="410" rx="24" fill="#FFFFFF" stroke="#D6DBE3" stroke-width="2"/>
  <path class="edge" data-flow-edge="suite-request-to-source" data-from="suite-request" data-to="suite-source" d="M250 385H275"/><path class="edge" data-flow-edge="suite-source-to-transfer" data-from="suite-source" data-to="suite-transfer" d="M465 385H490"/><path class="edge" data-flow-edge="suite-transfer-to-review" data-from="suite-transfer" data-to="suite-review" d="M680 385H705"/><path class="edge" data-flow-edge="suite-review-to-artifact" data-from="suite-review" data-to="suite-artifact" d="M895 385H920"/><path class="edge" data-flow-edge="suite-artifact-to-human" data-from="suite-artifact" data-to="suite-human" d="M1110 385H1135"/>
  <!-- main-flow -->
  <g data-flow-node="suite-request"><rect x="60" y="265" width="190" height="240" rx="18" fill="#EAF2FC" stroke="var(--blue)" stroke-width="2"/><text x="155" y="326" class="node-title" fill="var(--blue)" text-anchor="middle">연계 한 줄 요청</text><text x="155" y="369" class="node-body" text-anchor="middle">포트폴리오·면접</text><text x="155" y="398" class="node-body" text-anchor="middle">이미지·발표·재개</text></g>
  <g data-flow-node="suite-source" data-stage-label="Studio 원본·공개 범위"><rect x="275" y="265" width="190" height="240" rx="18" fill="#F0EEFC" stroke="var(--violet)" stroke-width="2"/><text x="370" y="318" class="node-title" fill="var(--violet)" text-anchor="middle">Studio 원본·</text><text x="370" y="346" class="node-title" fill="var(--violet)" text-anchor="middle">공개 범위</text><text x="370" y="389" class="node-body" text-anchor="middle">개인 기여·권리</text><text x="370" y="418" class="node-body" text-anchor="middle">제외 항목 확인</text></g>
  <g data-flow-node="suite-transfer"><rect x="490" y="265" width="190" height="240" rx="18" fill="#E8F6F1" stroke="var(--green)" stroke-width="2"/><text x="585" y="326" class="node-title" fill="var(--green)" text-anchor="middle">Career 전환 스킬</text><text x="585" y="369" class="node-body" text-anchor="middle">포트폴리오 작성</text><text x="585" y="398" class="node-body" text-anchor="middle">면접·성장 연결</text></g>
  <g data-flow-node="suite-review"><rect x="705" y="265" width="190" height="240" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="800" y="326" class="node-title" fill="var(--accent)" text-anchor="middle">결과 검토</text><text x="800" y="369" class="node-body" text-anchor="middle">근거·기여·권리</text><text x="800" y="398" class="node-body" text-anchor="middle">누락과 미정 확인</text></g>
  <g data-flow-node="suite-artifact" data-stage-label="포트폴리오·면접·발표"><rect x="920" y="265" width="190" height="240" rx="18" fill="#F1F3F6" stroke="#697587" stroke-width="2"/><text x="1015" y="318" class="node-title" fill="#536071" text-anchor="middle">포트폴리오·면접·</text><text x="1015" y="346" class="node-title" fill="#536071" text-anchor="middle">발표</text><text x="1015" y="389" class="node-body" text-anchor="middle">필요한 자료만 생성</text></g>
  <g data-flow-node="suite-human" data-human-gate="공개 책임자" data-gate-role="approval-hold" data-gate-label="승인·보류"><rect x="1135" y="265" width="190" height="240" rx="18" fill="#FDECF3" stroke="var(--rose)" stroke-width="2"/><text x="1230" y="318" class="node-title" fill="var(--rose)" text-anchor="middle">사람 승인·보류</text><text x="1230" y="361" class="node-body" text-anchor="middle">이름 있는 담당자가</text><text x="1230" y="390" class="node-body" text-anchor="middle">공개·제출 결정</text></g>
  <path class="resume" d="M1230 520V650H800V520"/><text x="887" y="632" class="caption">점선: 보류 사유를 읽고 실패하거나 부족한 작업만 재개</text>
  <rect x="48" y="718" width="1304" height="108" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="82" y="761" class="footer">원본 보존 원칙</text><text x="82" y="797" class="caption">Studio 기준 결과는 그대로 보존합니다. Career 활용 자료와 이미지·문서 출력은 각각 사람 검토를 거칩니다.</text>
</svg>
