<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Career 한 줄 요청이 학습과 취업 결과로 이어지는 흐름</title>
  <desc>Career가 현재 단계와 목표를 진단하고 필요한 최소 스킬 경로와 근거 검토 역할을 선택해 학습·취업 결과와 멘토 또는 본인 검토로 연결합니다.</desc>
  <style>svg{--paper:#F7F8FA;--ink:#2D3142;--muted:#616878;--accent:#EB6C36;--blue:#3972B6;--green:#27866B;--violet:#6258B7;--rose:#B23B68}.title{font-size:42px;font-weight:700;fill:var(--ink)}.sub{font-size:19px;fill:var(--muted)}.node-title{font-size:20px;font-weight:700}.node-body{font-size:16px;fill:var(--muted)}.caption{font-size:16px;fill:var(--muted)}.footer{font-size:17px;font-weight:600;fill:var(--ink)}.edge{fill:none;stroke:#667386;stroke-width:3;marker-end:url(#arrow)}.resume{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-accent)}</style>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#667386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EB6C36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1400" height="900" fill="var(--paper)"/><text x="62" y="76" class="title">Career는 목표에 필요한 최소 학습·취업 경로를 고릅니다</text><text x="62" y="114" class="sub">경력 단계가 불명확하면 여러 후보와 확인 과제를 남기며 한 진로를 단정하지 않습니다.</text>
  <rect x="48" y="176" width="1304" height="410" rx="24" fill="#FFFFFF" stroke="#D6DBE3" stroke-width="2"/>
  <path class="edge" data-flow-edge="career-request-to-diagnosis" data-from="career-request" data-to="career-diagnosis" d="M250 385H275"/><path class="edge" data-flow-edge="career-diagnosis-to-route" data-from="career-diagnosis" data-to="career-route" d="M465 385H490"/><path class="edge" data-flow-edge="career-route-to-roles" data-from="career-route" data-to="career-roles" d="M680 385H705"/><path class="edge" data-flow-edge="career-roles-to-artifact" data-from="career-roles" data-to="career-artifact" d="M895 385H920"/><path class="edge" data-flow-edge="career-artifact-to-human" data-from="career-artifact" data-to="career-human" d="M1110 385H1135"/>
  <!-- main-flow -->
  <g data-flow-node="career-request"><rect x="60" y="265" width="190" height="240" rx="18" fill="#EAF2FC" stroke="var(--blue)" stroke-width="2"/><text x="155" y="326" class="node-title" fill="var(--blue)" text-anchor="middle">Career 한 줄 요청</text><text x="155" y="369" class="node-body" text-anchor="middle">현재 상황·자료</text><text x="155" y="398" class="node-body" text-anchor="middle">원하는 결과 설명</text></g>
  <g data-flow-node="career-diagnosis" data-stage-label="경력 단계·목표 진단"><rect x="275" y="265" width="190" height="240" rx="18" fill="#F0EEFC" stroke="var(--violet)" stroke-width="2"/><text x="370" y="318" class="node-title" fill="var(--violet)" text-anchor="middle">경력 단계·목표</text><text x="370" y="346" class="node-title" fill="var(--violet)" text-anchor="middle">진단</text><text x="370" y="389" class="node-body" text-anchor="middle">역할 후보와</text><text x="370" y="418" class="node-body" text-anchor="middle">근거 공백 확인</text></g>
  <g data-flow-node="career-route"><rect x="490" y="265" width="190" height="240" rx="18" fill="#E8F6F1" stroke="var(--green)" stroke-width="2"/><text x="585" y="326" class="node-title" fill="var(--green)" text-anchor="middle">최소 스킬 경로</text><text x="585" y="369" class="node-body" text-anchor="middle">역할 지도·역기획</text><text x="585" y="398" class="node-body" text-anchor="middle">포트폴리오·면접</text></g>
  <g data-flow-node="career-roles"><rect x="705" y="265" width="190" height="240" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="800" y="318" class="node-title" fill="var(--accent)" text-anchor="middle">근거 검토 역할</text><text x="800" y="361" class="node-body" text-anchor="middle">멘토·근거 감사자</text><text x="800" y="390" class="node-body" text-anchor="middle">문서 품질 편집자</text></g>
  <g data-flow-node="career-artifact"><rect x="920" y="265" width="190" height="240" rx="18" fill="#F1F3F6" stroke="#697587" stroke-width="2"/><text x="1015" y="326" class="node-title" fill="#536071" text-anchor="middle">학습·취업 결과</text><text x="1015" y="369" class="node-body" text-anchor="middle">역할 지도·학습 계획</text><text x="1015" y="398" class="node-body" text-anchor="middle">근거와 미정 보존</text></g>
  <g data-flow-node="career-human" data-human-gate="사용자·멘토" data-gate-role="approval-hold" data-gate-label="승인·수정·보류"><rect x="1135" y="265" width="190" height="240" rx="18" fill="#FDECF3" stroke="var(--rose)" stroke-width="2"/><text x="1230" y="318" class="node-title" fill="var(--rose)" text-anchor="middle">멘토·본인 검토</text><text x="1230" y="361" class="node-body" text-anchor="middle">목표와 공개 범위</text><text x="1230" y="390" class="node-body" text-anchor="middle">승인·수정·보류</text></g>
  <path class="resume" d="M1230 520V650H585V520"/><text x="790" y="632" class="caption">점선: 피드백과 새 근거를 반영해 필요한 작업부터 재개</text>
  <rect x="48" y="718" width="1304" height="108" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="82" y="761" class="footer">결과 경계</text><text x="82" y="797" class="caption">학습 계획과 포트폴리오는 검토 자료입니다. 합격·채용 결과를 보장하거나 자동 승인하지 않습니다.</text>
</svg>
