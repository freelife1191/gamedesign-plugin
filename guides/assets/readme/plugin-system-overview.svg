<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>게임 제작 기획과 취업·학습 플러그인의 전체 시스템 구조</title>
  <desc>자연어 요청 시작점에서 Studio 기획, 기준 결과, Career 활용, 자동 검증, 사람 승인과 검토된 문서·이미지·도식 전달까지의 경계를 보여 줍니다.</desc>
  <style>
    svg{--paper:#F7F8FA;--ink:#2D3142;--muted:#616878;--accent:#EB6C36;--blue:#3972B6;--green:#27866B;--violet:#6258B7;--rose:#B23B68;--line:#667386}.title{font-size:42px;font-weight:700;fill:var(--ink)}.sub{font-size:19px;fill:var(--muted)}.node-title{font-size:20px;font-weight:700}.node-body{font-size:16px;fill:var(--muted)}.caption{font-size:16px;fill:var(--muted)}.footer{font-size:17px;font-weight:600;fill:var(--ink)}.edge{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#arrow)}.handoff{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-accent)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#667386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EB6C36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1400" height="900" fill="var(--paper)"/>
  <text x="58" y="72" class="title">게임 기획 플러그인 모음 전체 시스템 구조</text>
  <text x="58" y="110" class="sub">Studio는 제작 기획을, Career는 학습·취업 활용을 담당하며 자동 검증과 사람 결정을 분리합니다.</text>
  <rect x="42" y="154" width="1316" height="630" rx="24" fill="#FFFFFF" stroke="#D6DBE3" stroke-width="2"/>

  <path class="edge" data-flow-edge="entry-to-studio" data-from="entry" data-to="studio" d="M240 380H270V250H300"/>
  <path class="edge" data-flow-edge="studio-to-studio-artifact" data-from="studio" data-to="studio-artifact" d="M500 250H560"/>
  <path class="handoff" data-flow-edge="studio-artifact-to-career" data-from="studio-artifact" data-to="career" d="M660 310V390H400V450"/>
  <path class="edge" data-flow-edge="career-to-career-artifact" data-from="career" data-to="career-artifact" d="M500 510H560"/>
  <path class="edge" data-flow-edge="studio-artifact-to-validation" data-from="studio-artifact" data-to="validation" d="M760 250H805V350H850"/>
  <path class="edge" data-flow-edge="career-artifact-to-validation" data-from="career-artifact" data-to="validation" d="M760 510H815V410H850"/>
  <path class="edge" data-flow-edge="validation-to-human" data-from="validation" data-to="human" d="M1030 380H1080"/>
  <path class="edge" data-flow-edge="human-to-delivery" data-from="human" data-to="delivery" d="M1180 440V590"/>

  <!-- main-flow -->
  <g data-flow-node="entry"><rect x="60" y="320" width="180" height="120" rx="18" fill="#EAF2FC" stroke="var(--blue)" stroke-width="2"/><text x="150" y="366" class="node-title" fill="var(--blue)" text-anchor="middle">요청 시작점</text><text x="150" y="399" class="node-body" text-anchor="middle">App 자연어 요청</text><text x="150" y="425" class="node-body" text-anchor="middle">또는 고급 직접 호출</text></g>
  <g data-flow-node="studio" data-stage-label="Game Design Studio"><rect x="300" y="190" width="200" height="120" rx="18" fill="#F0EEFC" stroke="var(--violet)" stroke-width="2"/><text x="400" y="226" class="node-title" fill="var(--violet)" text-anchor="middle">게임 제작 기획</text><text x="400" y="252" class="node-body" text-anchor="middle">(Game Design Studio)</text><text x="400" y="278" class="node-body" text-anchor="middle">비전·시스템·UX·제작</text><text x="400" y="300" class="node-body" text-anchor="middle">전문 스킬·검토 역할</text></g>
  <g data-flow-node="studio-artifact"><rect x="560" y="190" width="200" height="120" rx="18" fill="#E8F6F1" stroke="var(--green)" stroke-width="2"/><text x="660" y="232" class="node-title" fill="var(--green)" text-anchor="middle">Studio 기준 결과</text><text x="660" y="266" class="node-body" text-anchor="middle">본문·근거·결정·자산</text><text x="660" y="292" class="node-body" text-anchor="middle">제작 기획의 원본 보존</text></g>
  <g data-flow-node="career" data-stage-label="Game Design Career"><rect x="300" y="450" width="200" height="120" rx="18" fill="#F0EEFC" stroke="var(--violet)" stroke-width="2"/><text x="400" y="486" class="node-title" fill="var(--violet)" text-anchor="middle">취업·학습 기획</text><text x="400" y="512" class="node-body" text-anchor="middle">(Game Design Career)</text><text x="400" y="538" class="node-body" text-anchor="middle">역할·학습·포트폴리오</text><text x="400" y="560" class="node-body" text-anchor="middle">면접·성장 경로</text></g>
  <g data-flow-node="career-artifact"><rect x="560" y="450" width="200" height="120" rx="18" fill="#E8F6F1" stroke="var(--green)" stroke-width="2"/><text x="660" y="492" class="node-title" fill="var(--green)" text-anchor="middle">Career 활용 결과</text><text x="660" y="526" class="node-body" text-anchor="middle">역할 지도·학습 계획</text><text x="660" y="552" class="node-body" text-anchor="middle">포트폴리오·면접 기록</text></g>
  <g data-flow-node="validation"><rect x="850" y="320" width="180" height="120" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="940" y="366" class="node-title" fill="var(--accent)" text-anchor="middle">자동 검증</text><text x="940" y="399" class="node-body" text-anchor="middle">구조·링크·도식·출력</text><text x="940" y="425" class="node-body" text-anchor="middle">실패는 보류로 기록</text></g>
  <g data-flow-node="human" data-human-gate="이름 있는 담당자" data-gate-role="approval-hold" data-gate-label="승인·보류"><rect x="1080" y="320" width="200" height="120" rx="18" fill="#FDECF3" stroke="var(--rose)" stroke-width="2"/><text x="1180" y="366" class="node-title" fill="var(--rose)" text-anchor="middle">사람 승인·보류</text><text x="1180" y="399" class="node-body" text-anchor="middle">범위·권리·공개·제출</text><text x="1180" y="425" class="node-body" text-anchor="middle">수정 또는 재개 결정</text></g>
  <g data-flow-node="delivery" data-stage-label="검토된 문서·이미지·도식"><rect x="1060" y="590" width="240" height="120" rx="18" fill="#F1F3F6" stroke="#697587" stroke-width="2"/><text x="1180" y="625" class="node-title" fill="#536071" text-anchor="middle">검토된 문서·이미지</text><text x="1180" y="651" class="node-title" fill="#536071" text-anchor="middle">검토된 도식</text><text x="1180" y="677" class="node-body" text-anchor="middle">MD·PDF·DOCX·PPTX</text><text x="1180" y="700" class="node-body" text-anchor="middle">SVG·PNG·승인된 이미지</text></g>
  <rect x="66" y="650" width="770" height="78" rx="16" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="92" y="683" class="footer">점선은 제품 간 활용 경로</text><text x="92" y="712" class="caption">Studio 원본은 그대로 보존하고 공개 가능한 판단과 검증만 Career 활용 결과로 옮깁니다.</text>
</svg>
