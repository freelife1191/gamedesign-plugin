<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Studio 한 줄 요청이 기획 결과와 사람 검토로 이어지는 흐름</title>
  <desc>사용자가 스킬을 직접 고르지 않아도 Studio가 목적을 분석하고 전문 스킬 또는 프로젝트 조율 경로를 선택해 기준 결과 폴더와 사람 검토로 연결합니다.</desc>
  <style>
    svg{--paper:#F7F8FA;--ink:#2D3142;--muted:#616878;--line:#9AA4B2;--accent:#EB6C36;--blue:#3972B6;--green:#27866B;--violet:#6258B7;--rose:#B23B68}.title{font-size:42px;font-weight:700;fill:var(--ink)}.sub{font-size:19px;fill:var(--muted)}.node-title{font-size:20px;font-weight:700}.node-body{font-size:16px;fill:var(--muted)}.caption{font-size:16px;fill:var(--muted)}.footer{font-size:17px;font-weight:600;fill:var(--ink)}.edge{fill:none;stroke:#667386;stroke-width:3;marker-end:url(#arrow)}.resume{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-accent)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#667386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EB6C36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1400" height="900" fill="var(--paper)"/>
  <text x="62" y="76" class="title">Studio는 한 문장 요청에서 필요한 기획 경로만 고릅니다</text>
  <text x="62" y="114" class="sub">스킬 이름을 몰라도 됩니다. 자동 선택과 사람 승인은 서로 다른 단계입니다.</text>
  <rect x="48" y="176" width="1304" height="410" rx="24" fill="#FFFFFF" stroke="#D6DBE3" stroke-width="2"/>
  <path class="edge" data-flow-edge="studio-request-to-intent" data-from="studio-request" data-to="studio-intent" d="M250 385H275"/>
  <path class="edge" data-flow-edge="studio-intent-to-route" data-from="studio-intent" data-to="studio-route" d="M465 385H490"/>
  <path class="edge" data-flow-edge="studio-route-to-roles" data-from="studio-route" data-to="studio-roles" d="M680 385H705"/>
  <path class="edge" data-flow-edge="studio-roles-to-artifact" data-from="studio-roles" data-to="studio-artifact" d="M895 385H920"/>
  <path class="edge" data-flow-edge="studio-artifact-to-human" data-from="studio-artifact" data-to="studio-human" d="M1110 385H1135"/>
  <!-- main-flow -->
  <g data-flow-node="studio-request"><rect x="60" y="265" width="190" height="240" rx="18" fill="#EAF2FC" stroke="var(--blue)" stroke-width="2"/><text x="155" y="326" class="node-title" fill="var(--blue)" text-anchor="middle">Studio 한 줄 요청</text><text x="155" y="369" class="node-body" text-anchor="middle">목표와 가진 자료</text><text x="155" y="398" class="node-body" text-anchor="middle">원하는 결과만 설명</text></g>
  <g data-flow-node="studio-intent"><rect x="275" y="265" width="190" height="240" rx="18" fill="#F0EEFC" stroke="var(--violet)" stroke-width="2"/><text x="370" y="326" class="node-title" fill="var(--violet)" text-anchor="middle">목적·결과 분석</text><text x="370" y="369" class="node-body" text-anchor="middle">단일 분야인지</text><text x="370" y="398" class="node-body" text-anchor="middle">복합 요청인지 판단</text></g>
  <g data-flow-node="studio-route" data-stage-label="전문 스킬 또는 프로젝트 조율"><rect x="490" y="265" width="190" height="240" rx="18" fill="#E8F6F1" stroke="var(--green)" stroke-width="2"/><text x="585" y="318" class="node-title" fill="var(--green)" text-anchor="middle">전문 스킬 또는</text><text x="585" y="346" class="node-title" fill="var(--green)" text-anchor="middle">프로젝트 조율</text><text x="585" y="389" class="node-body" text-anchor="middle">비전·시스템·UX</text><text x="585" y="418" class="node-body" text-anchor="middle">필요한 경로만 실행</text></g>
  <g data-flow-node="studio-roles"><rect x="705" y="265" width="190" height="240" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/><text x="800" y="326" class="node-title" fill="var(--accent)" text-anchor="middle">검토 역할 선택</text><text x="800" y="369" class="node-body" text-anchor="middle">질문이 다를 때만</text><text x="800" y="398" class="node-body" text-anchor="middle">최대 세 역할</text></g>
  <g data-flow-node="studio-artifact"><rect x="920" y="265" width="190" height="240" rx="18" fill="#F1F3F6" stroke="#697587" stroke-width="2"/><text x="1015" y="326" class="node-title" fill="#536071" text-anchor="middle">기준 결과 폴더</text><text x="1015" y="369" class="node-body" text-anchor="middle">본문·근거·결정</text><text x="1015" y="398" class="node-body" text-anchor="middle">검증 상태 보존</text></g>
  <g data-flow-node="studio-human" data-human-gate="기획 책임자" data-gate-role="approval-hold" data-gate-label="승인·수정·보류"><rect x="1135" y="265" width="190" height="240" rx="18" fill="#FDECF3" stroke="var(--rose)" stroke-width="2"/><text x="1230" y="326" class="node-title" fill="var(--rose)" text-anchor="middle">사람 검토</text><text x="1230" y="369" class="node-body" text-anchor="middle">기획 책임자가</text><text x="1230" y="398" class="node-body" text-anchor="middle">승인·수정·보류</text></g>
  <path class="resume" d="M1230 520V650H585V520"/>
  <text x="795" y="632" class="caption">점선: 보류 이유를 반영해 필요한 경로만 다시 실행</text>
  <rect x="48" y="718" width="1304" height="108" rx="18" fill="#FFF1EA" stroke="var(--accent)" stroke-width="2"/>
  <text x="82" y="761" class="footer">선택 결과 보고</text><text x="82" y="797" class="caption">사용한 스킬, 검토 역할, 결과 파일과 남은 결정을 알려 줍니다. 자동 선택은 자동 승인이 아닙니다.</text>
</svg>
