<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">대표 진입 스킬은 요청을 route 하나로 좁힙니다</title><desc id="desc">자연어 요청이나 사례 ID를 받아 소유 제품과 route 하나를 정하고, 라우팅 영수증에 routeId만 채운 뒤 전문 스킬로 위임하거나 상대 제품 요청을 단방향 인계 후보로 분리하는 흐름입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">대표 진입 스킬은 요청을 route 하나로 좁힙니다</text><text x="70" y="110" class="body" font-size="20">스킬 이름을 몰라도 됩니다. 사례 ID만 넘겨도 카탈로그에서 실행 경로 하나로 바뀝니다.</text>
  <g aria-label="읽기 순서 1: 요청 도착"><rect x="40" y="164" width="1320" height="150" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="182" width="150" height="42" rx="21" fill="var(--blue)"/><text x="139" y="203" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">요청 도착</text><rect x="300" y="200" width="320" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="460" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">자연어 요청</text><text x="460" y="270" class="body" font-size="17" text-anchor="middle">원하는 결과와 가진 자료</text><rect x="780" y="200" width="320" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="940" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">사례 ID</text><text x="940" y="270" class="body" font-size="17" text-anchor="middle">카탈로그의 키 · ST-C01</text></g>
  <path d="M700 322V346" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 대표 진입 스킬의 작업"><rect x="40" y="358" width="1320" height="196" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="376" width="216" height="42" rx="21" fill="var(--purple)"/><text x="172" y="397" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">대표 진입 스킬</text><rect x="80" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="260" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">요청 정규화</text><text x="260" y="504" class="body" font-size="17" text-anchor="middle">모르는 값은 미정으로 둡니다</text><path d="M452 484H488" class="line" marker-end="url(#arrow)"/><rect x="500" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="680" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">소유 제품 판정</text><text x="680" y="504" class="body" font-size="17" text-anchor="middle">Studio 또는 Career 하나</text><path d="M872 484H908" class="line" marker-end="url(#arrow)"/><rect x="920" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="1100" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">route 하나 선택</text><text x="1100" y="504" class="body" font-size="17" text-anchor="middle">여러 개로 넘기지 않습니다</text></g>
  <path d="M700 562V586" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 남기는 것과 넘기는 곳"><rect x="40" y="598" width="1320" height="248" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="616" width="216" height="42" rx="21" fill="var(--amber)"/><text x="172" y="637" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">남기는 것</text><rect x="80" y="674" width="380" height="140" rx="12" class="card" stroke="var(--amber)"/><text x="270" y="716" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">라우팅 영수증</text><text x="270" y="750" class="body" font-size="17" text-anchor="middle">route-receipt.json의</text><text x="270" y="776" class="body" font-size="17" text-anchor="middle">routeId만 채웁니다</text><rect x="500" y="674" width="380" height="140" rx="12" class="card" stroke="var(--blue)"/><text x="690" y="716" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">전문 스킬 위임</text><text x="690" y="750" class="body" font-size="17" text-anchor="middle">선택된 route가 지목한</text><text x="690" y="776" class="body" font-size="17" text-anchor="middle">스킬 하나를 호출합니다</text><rect x="920" y="674" width="380" height="140" rx="12" class="card" stroke="var(--purple)"/><text x="1110" y="716" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">단방향 인계 후보</text><text x="1110" y="750" class="body" font-size="17" text-anchor="middle">상대 제품 소유 요청은</text><text x="1110" y="776" class="body" font-size="17" text-anchor="middle">근거 요청으로만 분리</text></g>
</svg>
