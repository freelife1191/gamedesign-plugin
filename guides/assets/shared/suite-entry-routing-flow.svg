<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">대표 스킬이 요청을 읽고 실행할 작업을 정합니다</title><desc id="desc">자연어 요청이나 사례 ID를 읽고 담당 제품과 실행 경로를 하나씩 정합니다. 먼저 여섯 줄 라우팅 영수증에 선택 근거를 남긴 뒤 전문 스킬이나 오케스트레이터와 최대 세 개의 검토 역할을 실행합니다. 다른 제품이 맡아야 하는 요청은 근거와 함께 한 번만 전달합니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">대표 스킬이 요청을 읽고 실행할 작업을 정합니다</text><text x="70" y="110" class="body" font-size="20">여섯 줄 라우팅 영수증에 선택 근거를 남긴 뒤 전문 스킬이나 오케스트레이터를 실행합니다.</text>
  <g aria-label="읽기 순서 1: 요청 도착"><rect x="40" y="164" width="1320" height="150" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="182" width="150" height="42" rx="21" fill="var(--blue)"/><text x="139" y="203" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">요청 도착</text><rect x="300" y="200" width="320" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="460" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">자연어 요청</text><text x="460" y="270" class="body" font-size="17" text-anchor="middle">원하는 결과와 가진 자료</text><rect x="780" y="200" width="320" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="940" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">사례 ID</text><text x="940" y="270" class="body" font-size="17" text-anchor="middle">카탈로그의 키 · ST-C01</text></g>
  <path d="M700 322V346" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 대표 스킬이 하는 일"><rect x="40" y="358" width="1320" height="196" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="376" width="216" height="42" rx="21" fill="var(--purple)"/><text x="172" y="397" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">대표 스킬</text><rect x="80" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="260" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">요청 정리</text><text x="260" y="504" class="body" font-size="17" text-anchor="middle">모르는 값은 미정으로 남깁니다</text><path d="M452 484H488" class="line" marker-end="url(#arrow)"/><rect x="500" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="680" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">담당 제품 결정</text><text x="680" y="504" class="body" font-size="17" text-anchor="middle">Studio와 Career 중 하나</text><path d="M872 484H908" class="line" marker-end="url(#arrow)"/><rect x="920" y="434" width="360" height="100" rx="12" class="card" stroke="var(--purple)"/><text x="1100" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">실행 방식 선택</text><text x="1100" y="504" class="body" font-size="17" text-anchor="middle">전문 스킬 또는 오케스트레이터</text></g>
  <path d="M700 562V586" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 선택 기록과 실행 결과"><rect x="40" y="598" width="1320" height="248" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="616" width="216" height="42" rx="21" fill="var(--amber)"/><text x="172" y="637" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">선택 기록과 실행</text><rect x="80" y="674" width="380" height="140" rx="12" class="card" stroke="var(--amber)"/><text x="270" y="716" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">라우팅 영수증</text><text x="270" y="750" class="body" font-size="16" text-anchor="middle">route-receipt.json · 여섯 줄</text><text x="270" y="776" class="body" font-size="17" text-anchor="middle">routeId와 선택한 스킬 기록</text><rect x="500" y="674" width="380" height="140" rx="12" class="card" stroke="var(--blue)"/><text x="690" y="716" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">선택한 작업 실행</text><text x="690" y="750" class="body" font-size="17" text-anchor="middle">전문 스킬 또는 오케스트레이터</text><text x="690" y="776" class="body" font-size="17" text-anchor="middle">필요한 검토 역할 최대 세 개</text><rect x="920" y="674" width="380" height="140" rx="12" class="card" stroke="var(--purple)"/><text x="1110" y="716" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">다른 제품에 넘길 항목</text><text x="1110" y="750" class="body" font-size="17" text-anchor="middle">다른 제품이 맡아야 할 요청은</text><text x="1110" y="776" class="body" font-size="17" text-anchor="middle">근거와 함께 한 번만 전달</text></g>
</svg>
