<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">담당자가 확인해야 기준 결과를 다음 단계로 넘길 수 있습니다</title><desc id="desc">Markdown 원본을 기준 결과 폴더에 보존하고 전문 검토 내용을 확인한 뒤, 담당자의 결정에 따라 자산 검증이나 문서 내보내기 준비로 이어지는 흐름입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--amber:#a86700;--green:#0f7a5f}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.line{stroke:#5b6675;stroke-width:2;fill:none}.on-accent{fill:#fff}.card-title{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">담당자가 확인해야 기준 결과를 다음 단계로 넘길 수 있습니다</text><text x="70" y="110" class="body" font-size="20">작성이 끝났다고 승인된 것은 아닙니다. 근거와 검토 내용을 확인한 뒤 다음 작업을 준비합니다.</text><rect x="40" y="180" width="1320" height="640" rx="20" fill="#f4f8fc" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 기준 결과 폴더 작성"><rect x="80" y="330" width="320" height="210" rx="12" fill="#e8f1fb" stroke="var(--blue)" stroke-width="2"/><text x="240" y="405" class="card-title" fill="#124267" font-size="26" text-anchor="middle" dominant-baseline="central">기준 결과 폴더</text><text x="240" y="445" class="body" font-size="19" text-anchor="middle">content.md와 근거</text></g><path d="M412 435H448" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 전문 검토"><rect x="460" y="330" width="320" height="210" rx="12" fill="#fff7e8" stroke="#a86700" stroke-width="2"/><text x="620" y="405" class="card-title" fill="#774800" font-size="26" text-anchor="middle" dominant-baseline="central">전문 검토</text><text x="620" y="445" class="body" font-size="19" text-anchor="middle">검토 결과와 결정 항목</text></g><path d="M792 435H828" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 담당자 결정"><rect x="840" y="300" width="320" height="270" rx="12" fill="#e7f5ef" stroke="var(--green)" stroke-width="3"/><rect x="914" y="324" width="172" height="34" rx="17" fill="var(--green)"/><text x="1000" y="341" class="on-accent" font-size="17" text-anchor="middle" dominant-baseline="central">담당자 확인</text><text x="1000" y="425" class="card-title" fill="#085041" font-size="27" text-anchor="middle" dominant-baseline="central">담당자 결정</text><text x="1000" y="465" class="body" font-size="19" text-anchor="middle">수용 · 수정 · 예외 · 보류</text><text x="1000" y="500" class="body" font-size="17" text-anchor="middle">AI가 승인 상태로 바꾸지 않음</text></g>
  <path d="M1000 582V664" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 4: 자산과 내보내기 준비"><rect x="700" y="676" width="600" height="86" rx="12" fill="#fff" stroke="var(--hair)"/><text x="1000" y="718" class="card-title" fill="var(--ink)" font-size="23" text-anchor="middle" dominant-baseline="central">자산 검증 또는 MD·PDF·DOCX·PPTX 내보내기 준비</text></g>
</svg>
