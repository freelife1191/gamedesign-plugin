<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">이미지 자산은 생성만으로 승인되지 않습니다</title><desc id="desc">이미지 자산이 concept-draft에서 named visual reviewer와 human rights reviewer를 거쳐 document-approved와 production-candidate로 이동하는 staged flow입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--amber:#a86700;--green:#0f7a5f}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card-title{font-weight:700}.line{stroke:#5b6675;stroke-width:2;fill:none}.on-accent{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">이미지 자산은 생성만으로 승인되지 않습니다</text><text x="70" y="110" class="body" font-size="20">각 상태 전환은 파일 존재가 아니라 이름 있는 사람의 검토와 권리·provenance 근거를 요구합니다.</text><rect x="40" y="180" width="1320" height="640" rx="20" fill="#f4f8fc" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: concept-draft"><rect x="80" y="330" width="320" height="220" rx="12" fill="#e8f1fb" stroke="var(--blue)" stroke-width="2"/><text x="240" y="408" class="card-title" fill="#124267" font-size="26" text-anchor="middle" dominant-baseline="central">concept-draft</text><text x="240" y="450" class="body" font-size="18" text-anchor="middle">plan · prompt · 생성 결과</text></g><path d="M412 440H448" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: named visual review"><rect x="460" y="300" width="320" height="280" rx="12" fill="#fff7e8" stroke="#a86700" stroke-width="2"/><rect x="525" y="324" width="190" height="34" rx="17" fill="#a86700"/><text x="620" y="341" class="on-accent" font-size="17" text-anchor="middle" dominant-baseline="central">named visual reviewer</text><text x="620" y="430" class="card-title" fill="#774800" font-size="25" text-anchor="middle" dominant-baseline="central">문서 검토</text><text x="620" y="470" class="body" font-size="18" text-anchor="middle">purpose · alt · readability</text><text x="620" y="503" class="body" font-size="18" text-anchor="middle">rights · provenance</text></g><path d="M792 440H828" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: document-approved"><rect x="840" y="330" width="320" height="220" rx="12" fill="#e7f5ef" stroke="var(--green)" stroke-width="2"/><text x="1000" y="408" class="card-title" fill="#085041" font-size="25" text-anchor="middle" dominant-baseline="central">document-approved</text><text x="1000" y="450" class="body" font-size="18" text-anchor="middle">final derivative 참조 가능</text></g>
  <path d="M1000 562V638" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 4: human rights review와 production-candidate"><rect x="760" y="660" width="480" height="90" rx="12" fill="#fff" stroke="var(--hair)"/><text x="1000" y="692" class="card-title" fill="var(--ink)" font-size="21" text-anchor="middle" dominant-baseline="central">human rights reviewer → production-candidate</text><text x="1000" y="722" class="body" font-size="17" text-anchor="middle">release·legal·production approval과는 별도</text></g>
</svg>
