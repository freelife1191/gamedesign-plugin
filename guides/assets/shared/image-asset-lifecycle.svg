<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">이미지 자산은 생성만으로 승인되지 않습니다</title><desc id="desc">이미지 자산은 콘셉트 초안에서 지정된 시각 검토자와 권리 검토 담당자의 확인을 거쳐 문서 승인 완료와 제작 검토 후보 상태로 이동합니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--amber:#a86700;--green:#0f7a5f}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card-title{font-weight:700}.line{stroke:#5b6675;stroke-width:2;fill:none}.on-accent{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">이미지 자산은 생성만으로 승인되지 않습니다</text><text x="70" y="110" class="body" font-size="20">상태를 바꾸려면 파일뿐 아니라 담당자의 검토와 권리·출처 근거가 함께 있어야 합니다.</text><rect x="40" y="180" width="1320" height="640" rx="20" fill="#f4f8fc" stroke="var(--hair)"/>
  <g aria-label="읽기 순서 1: 콘셉트 초안"><rect x="80" y="330" width="320" height="220" rx="12" fill="#e8f1fb" stroke="var(--blue)" stroke-width="2"/><text x="240" y="408" class="card-title" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">콘셉트 초안 (concept-draft)</text><text x="240" y="450" class="body" font-size="18" text-anchor="middle">계획 · 프롬프트 · 생성 결과</text></g><path d="M412 440H448" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 지정된 시각 검토"><rect x="460" y="300" width="320" height="280" rx="12" fill="#fff7e8" stroke="#a86700" stroke-width="2"/><rect x="525" y="324" width="190" height="34" rx="17" fill="#a86700"/><text x="620" y="341" class="on-accent" font-size="17" text-anchor="middle" dominant-baseline="central">지정된 시각 검토자</text><text x="620" y="430" class="card-title" fill="#774800" font-size="25" text-anchor="middle" dominant-baseline="central">문서 검토</text><text x="620" y="470" class="body" font-size="18" text-anchor="middle">용도 · 대체 텍스트 · 가독성</text><text x="620" y="503" class="body" font-size="18" text-anchor="middle">권리 · 출처 근거</text></g><path d="M792 440H828" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 문서 승인 완료"><rect x="840" y="330" width="320" height="220" rx="12" fill="#e7f5ef" stroke="var(--green)" stroke-width="2"/><text x="1000" y="395" class="card-title" fill="#085041" font-size="23" text-anchor="middle" dominant-baseline="central">문서 승인 완료</text><text x="1000" y="427" class="body" font-size="17" text-anchor="middle">document-approved</text><text x="1000" y="466" class="body" font-size="18" text-anchor="middle">최종 파생 문서에서 참조 가능</text></g>
  <path d="M1000 562V638" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 4: 권리 검토와 제작 검토 후보"><rect x="760" y="650" width="480" height="110" rx="12" fill="#fff" stroke="var(--hair)"/><text x="1000" y="680" class="card-title" fill="var(--ink)" font-size="19" text-anchor="middle" dominant-baseline="central">권리 검토 담당자 → 제작 검토 후보</text><text x="1000" y="711" class="body" font-size="17" text-anchor="middle">production-candidate</text><text x="1000" y="738" class="body" font-size="17" text-anchor="middle">출시·법무·제작 승인은 별도로 진행</text></g>
</svg>
