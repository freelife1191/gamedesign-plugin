<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">내보내기 준비 상태는 renderer와 QA를 앞서가지 않습니다</title><desc id="desc">검증된 Canonical Artifact의 export preflight가 MD, PDF, DOCX, PPTX로 분기되며 pending, blocked, unavailable 상태를 보존하는 branching flow입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a86700}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card-title{font-weight:700}.line{stroke:#5b6675;stroke-width:2;fill:none}.on-accent{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">내보내기 준비 상태는 renderer와 QA를 앞서가지 않습니다</text><text x="70" y="110" class="body" font-size="20">생성 파일이나 passed/failed status를 미리 선언하지 않고, capability별 준비 상태와 다음 검증을 남깁니다.</text>
  <g aria-label="읽기 순서 1: preflight"><rect x="40" y="180" width="1320" height="182" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="460" y="226" width="480" height="92" rx="12" fill="#e8f1fb" stroke="var(--blue)" stroke-width="2"/><text x="700" y="258" class="card-title" fill="#124267" font-size="25" text-anchor="middle" dominant-baseline="central">Canonical Artifact export preflight</text><text x="700" y="289" class="body" font-size="18" text-anchor="middle">source · evidence · capability · safe output</text></g>
  <path d="M700 330V418" class="line" marker-end="url(#arrow)"/><g aria-label="읽기 순서 2: format branches"><rect x="40" y="450" width="1320" height="310" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><path d="M700 430V486M205 486H1195M205 486V520M535 486V520M865 486V520M1195 486V520" class="line"/><rect x="80" y="532" width="250" height="164" rx="12" fill="#e7f5ef" stroke="var(--green)" stroke-width="2"/><text x="205" y="580" class="card-title" fill="#085041" font-size="26" text-anchor="middle" dominant-baseline="central">MD</text><text x="205" y="618" class="body" font-size="18" text-anchor="middle">pending 또는 unavailable</text><text x="205" y="650" class="body" font-size="17" text-anchor="middle">canonical text 유지</text><rect x="410" y="532" width="250" height="164" rx="12" fill="#ecebfb" stroke="var(--purple)" stroke-width="2"/><text x="535" y="580" class="card-title" fill="#3c3489" font-size="26" text-anchor="middle" dominant-baseline="central">PDF</text><text x="535" y="618" class="body" font-size="18" text-anchor="middle">pending 또는 unavailable</text><text x="535" y="650" class="body" font-size="17" text-anchor="middle">page visual QA 필요</text><rect x="740" y="532" width="250" height="164" rx="12" fill="#fff7e8" stroke="#a86700" stroke-width="2"/><text x="865" y="580" class="card-title" fill="#774800" font-size="26" text-anchor="middle" dominant-baseline="central">DOCX</text><text x="865" y="618" class="body" font-size="18" text-anchor="middle">blocked 또는 pending</text><text x="865" y="650" class="body" font-size="17" text-anchor="middle">OOXML QA 필요</text><rect x="1070" y="532" width="250" height="164" rx="12" fill="#fff" stroke="var(--hair)" stroke-width="2"/><text x="1195" y="580" class="card-title" fill="var(--ink)" font-size="26" text-anchor="middle" dominant-baseline="central">PPTX</text><text x="1195" y="618" class="body" font-size="18" text-anchor="middle">blocked 또는 pending</text><text x="1195" y="650" class="body" font-size="17" text-anchor="middle">독립 story와 slide QA</text></g>
</svg>
