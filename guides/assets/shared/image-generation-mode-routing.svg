<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">IMAGE_GEN_MODE는 생성 범위를 먼저 제한합니다</title><desc id="desc">prompt-only, select, required, all 모드가 외부 호출, 사용자 selection receipt, manifest 선언에 따라 생성 범위를 결정하는 decision flow입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--green:#0f7a5f;--amber:#a86700}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.card-title{font-weight:700}.line{stroke:#5b6675;stroke-width:2;fill:none}.on-accent{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">IMAGE_GEN_MODE는 생성 범위를 먼저 제한합니다</text><text x="70" y="110" class="body" font-size="20">모드는 비용과 외부 호출 경계를 정하며, provider routing이나 승인을 대체하지 않습니다.</text>
  <g aria-label="읽기 순서 1: 기본 prompt-only"><rect x="40" y="180" width="1320" height="154" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="80" y="218" width="270" height="78" rx="12" fill="#e8f1fb" stroke="var(--blue)"/><text x="215" y="245" class="card-title" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">prompt-only</text><text x="215" y="274" class="body" font-size="17" text-anchor="middle">외부 호출 0회</text><path d="M362 257H398" class="line" marker-end="url(#arrow)"/><text x="450" y="257" class="body" font-size="21" dominant-baseline="central">plan · prompt · placeholder만 보존</text></g>
  <g aria-label="읽기 순서 2: 생성 모드 선택"><rect x="40" y="382" width="1320" height="366" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><text x="700" y="402" class="body" font-size="18" text-anchor="middle">생성 요청이면 하나의 mode를 선택</text><path d="M205 410H1145M205 410V406M515 410V406M825 410V406M1145 410V406" class="line"/><rect x="80" y="418" width="250" height="286" rx="12" fill="#fff7e8" stroke="#a86700" stroke-width="2"/><text x="205" y="510" class="card-title" fill="#774800" font-size="25" text-anchor="middle" dominant-baseline="central">select</text><text x="205" y="550" class="body" font-size="17" text-anchor="middle">ordered stable IDs</text><text x="205" y="580" class="body" font-size="17" text-anchor="middle">immutable receipt 필요</text><rect x="390" y="418" width="250" height="286" rx="12" fill="#ecebfb" stroke="var(--purple)" stroke-width="2"/><text x="515" y="510" class="card-title" fill="#3c3489" font-size="25" text-anchor="middle" dominant-baseline="central">required</text><text x="515" y="550" class="body" font-size="17" text-anchor="middle">manifest required</text><text x="515" y="580" class="body" font-size="17" text-anchor="middle">finite asset만</text><rect x="700" y="418" width="250" height="286" rx="12" fill="#e7f5ef" stroke="var(--green)" stroke-width="2"/><text x="825" y="510" class="card-title" fill="#085041" font-size="25" text-anchor="middle" dominant-baseline="central">all</text><text x="825" y="550" class="body" font-size="17" text-anchor="middle">required · recommended</text><text x="825" y="580" class="body" font-size="17" text-anchor="middle">declared variant만</text><rect x="1010" y="418" width="270" height="286" rx="12" fill="#fff" stroke="var(--hair)" stroke-width="2"/><text x="1145" y="510" class="card-title" fill="var(--ink)" font-size="24" text-anchor="middle" dominant-baseline="central">공통 경계</text><text x="1145" y="550" class="body" font-size="17" text-anchor="middle">선언 밖 variant 금지</text><text x="1145" y="580" class="body" font-size="17" text-anchor="middle">후속 승인과 분리</text></g>
</svg>
