<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">인계는 한 번이고 방향은 하나입니다</title><desc id="desc">최종 산출물을 내는 제품만 owner가 되고 supplier 제품은 요청받은 증거만 한 번 돌려주며, 상대 제품이 없거나 비활성이면 blocker를 남기고 멈추는 단방향 인계 흐름입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a;--rose:#a33a52}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--purple)"/><text x="70" y="74" class="title" font-size="42">인계는 한 번이고 방향은 하나입니다</text><text x="70" y="110" class="body" font-size="20">최종 산출물을 내는 제품만 owner입니다. 상대 제품은 요청받은 증거만 돌려줍니다.</text>
  <g aria-label="읽기 순서 1: owner 확정"><rect x="40" y="164" width="1320" height="150" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="182" width="180" height="42" rx="21" fill="var(--blue)"/><text x="154" y="203" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">owner 확정</text><rect x="300" y="200" width="300" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="450" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">요청 도착</text><text x="450" y="270" class="body" font-size="17" text-anchor="middle">두 제품 근거가 모두 필요</text><path d="M612 248H648" class="line" marker-end="url(#arrow)"/><rect x="660" y="200" width="300" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="810" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">소유 제품 판정</text><text x="810" y="270" class="body" font-size="17" text-anchor="middle">최종 산출물이 나오는 쪽</text><path d="M972 248H1008" class="line" marker-end="url(#arrow)"/><rect x="1020" y="200" width="300" height="96" rx="12" class="card" stroke="var(--blue)"/><text x="1170" y="238" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">최종 owner</text><text x="1170" y="270" class="body" font-size="17" text-anchor="middle">returnToSkill의 주인</text></g>
  <path d="M700 322V346" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: supplier evidence와 단방향 반환"><rect x="40" y="358" width="1320" height="212" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="376" width="260" height="42" rx="21" fill="var(--purple)"/><text x="194" y="397" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">supplier evidence</text><rect x="80" y="434" width="380" height="116" rx="12" class="card" stroke="var(--purple)"/><text x="270" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">증거 요청 한 번</text><text x="270" y="504" class="body" font-size="17" text-anchor="middle">requestedOutputs와</text><text x="270" y="528" class="body" font-size="17" text-anchor="middle">sourceArtifactIds를 지정</text><path d="M472 492H508" class="line" marker-end="url(#arrow)"/><rect x="520" y="434" width="380" height="116" rx="12" class="card" stroke="var(--purple)"/><text x="710" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">supplier 응답</text><text x="710" y="504" class="body" font-size="17" text-anchor="middle">facts · inferences ·</text><text x="710" y="528" class="body" font-size="17" text-anchor="middle">recommendations · unknowns</text><path d="M912 492H948" class="line" marker-end="url(#arrow)"/><rect x="960" y="434" width="360" height="116" rx="12" class="card" stroke="var(--purple)"/><text x="1140" y="472" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">단방향 반환</text><text x="1140" y="504" class="body" font-size="17" text-anchor="middle">owner에게 한 번 돌려주고</text><text x="1140" y="528" class="body" font-size="17" text-anchor="middle">다시 인계하지 않습니다</text></g>
  <path d="M400 578V602" class="line" marker-end="url(#arrow)"/>
  <path d="M1000 578V602" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 상대 부재와 사람 승인"><rect x="40" y="614" width="1320" height="232" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="632" width="180" height="42" rx="21" fill="var(--amber)"/><text x="154" y="653" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">멈춤과 승인</text><rect x="80" y="690" width="580" height="140" rx="12" class="card" stroke="var(--rose)"/><text x="370" y="732" class="label" fill="#7d2c40" font-size="22" text-anchor="middle" dominant-baseline="central">상대 제품이 없거나 비활성</text><text x="370" y="766" class="body" font-size="17" text-anchor="middle">증거를 지어내지 않고 blocker를 남깁니다</text><text x="370" y="792" class="body" font-size="17" text-anchor="middle">가진 것만으로 부분 완성하고 멈춥니다</text><rect x="740" y="690" width="580" height="140" rx="12" class="card" stroke="var(--amber)"/><text x="1030" y="732" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">사람 승인 gate</text><text x="1030" y="766" class="body" font-size="17" text-anchor="middle">owner가 받은 증거를 자기 기준으로 다시 나눕니다</text><text x="1030" y="792" class="body" font-size="17" text-anchor="middle">이름이 확인된 사람이 공개 범위를 결정합니다</text></g>
</svg>
