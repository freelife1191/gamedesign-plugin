<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">업데이트는 사용자가 승인한 뒤에만 적용합니다</title><desc id="desc">upgrade-game-design-suite가 설치된 버전과 최신 공개 릴리스를 비교하고 변경 계획을 보여 줍니다. 사용자가 '지금 업데이트'를 선택하면 codex plugin add로 제품을 다시 설치하고, 설치 상태를 확인한 뒤 새 채팅이나 세션에서 작업을 이어 갑니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a;--green:#2f7048}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--amber)"/><text x="70" y="74" class="title" font-size="42">업데이트는 사용자가 승인한 뒤에만 적용합니다</text><text x="70" y="110" class="body" font-size="20">버전을 비교하고 변경 계획을 확인하는 동안에는 설치 내용이 달라지지 않습니다.</text>
  <g aria-label="읽기 순서 1: 알림과 버전 비교"><rect x="40" y="164" width="1320" height="196" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="182" width="180" height="42" rx="21" fill="var(--blue)"/><text x="154" y="203" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">알림과 비교</text><rect x="80" y="240" width="380" height="100" rx="12" class="card" stroke="var(--blue)"/><text x="270" y="278" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">새 릴리스 확인</text><text x="270" y="310" class="body" font-size="17" text-anchor="middle">처음 실행하거나 7일이 지나면 알림</text><path d="M472 290H508" class="line" marker-end="url(#arrow)"/><rect x="520" y="240" width="380" height="100" rx="12" class="card" stroke="var(--blue)"/><text x="710" y="278" class="label" fill="#124267" font-size="21" text-anchor="middle" dominant-baseline="central">upgrade-game-design-suite</text><text x="710" y="310" class="body" font-size="17" text-anchor="middle">설치본은 그대로 두고 버전 비교</text><path d="M912 290H948" class="line" marker-end="url(#arrow)"/><rect x="960" y="240" width="360" height="100" rx="12" class="card" stroke="var(--blue)"/><text x="1140" y="278" class="label" fill="#124267" font-size="22" text-anchor="middle" dominant-baseline="central">변경 내용 확인</text><text x="1140" y="310" class="body" font-size="17" text-anchor="middle">현재 버전과 최신 공개 릴리스</text></g>
  <path d="M700 368V392" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: 사용자가 업데이트 여부 결정"><rect x="40" y="404" width="1320" height="148" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="422" width="216" height="42" rx="21" fill="var(--amber)"/><text x="172" y="443" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">사용자 결정</text><rect x="300" y="440" width="440" height="96" rx="12" class="card" stroke="var(--amber)"/><text x="520" y="478" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">지금 업데이트</text><text x="520" y="510" class="body" font-size="17" text-anchor="middle">이 선택 뒤에만 제품을 다시 설치</text><rect x="800" y="440" width="520" height="96" rx="12" class="card" stroke="var(--muted)"/><text x="1060" y="478" class="label" fill="#3f4a59" font-size="22" text-anchor="middle" dominant-baseline="central">나중에 · 이번 버전 건너뛰기 · 알림 끄기</text><text x="1060" y="510" class="body" font-size="17" text-anchor="middle">설치 상태를 바꾸지 않고 종료</text></g>
  <path d="M520 560V584" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 3: 재설치와 확인 후 새 세션에서 재개"><rect x="40" y="596" width="1320" height="250" rx="20" fill="#f4faf6" stroke="var(--hair)"/><rect x="64" y="614" width="216" height="42" rx="21" fill="var(--green)"/><text x="172" y="635" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">적용과 재개</text><rect x="80" y="672" width="380" height="140" rx="12" class="card" stroke="var(--green)"/><text x="270" y="714" class="label" fill="#1f5136" font-size="22" text-anchor="middle" dominant-baseline="central">선택한 제품 다시 설치</text><text x="270" y="748" class="body" font-size="17" text-anchor="middle">codex plugin add</text><text x="270" y="774" class="body" font-size="17" text-anchor="middle">제품 ID를 하나씩 지정</text><path d="M472 742H508" class="line" marker-end="url(#arrow)"/><rect x="520" y="672" width="380" height="140" rx="12" class="card" stroke="var(--green)"/><text x="710" y="714" class="label" fill="#1f5136" font-size="22" text-anchor="middle" dominant-baseline="central">설치 확인</text><text x="710" y="748" class="body" font-size="17" text-anchor="middle">codex plugin list에서</text><text x="710" y="774" class="body" font-size="17" text-anchor="middle">버전과 설치 상태 확인</text><path d="M912 742H948" class="line" marker-end="url(#arrow)"/><rect x="960" y="672" width="360" height="140" rx="12" class="card" stroke="var(--green)"/><text x="1140" y="714" class="label" fill="#1f5136" font-size="22" text-anchor="middle" dominant-baseline="central">새 채팅·세션에서 계속</text><text x="1140" y="748" class="body" font-size="17" text-anchor="middle">App은 새 채팅을 열고</text><text x="1140" y="774" class="body" font-size="17" text-anchor="middle">CLI는 새 세션을 시작</text></g>
</svg>
