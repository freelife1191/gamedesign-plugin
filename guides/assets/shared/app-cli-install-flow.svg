<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">App과 CLI는 각자의 설치 표면에서 검증합니다</title><desc id="desc">Codex App과 Codex CLI에서 같은 plugin을 설치하되 App은 새 채팅, CLI는 새 세션으로 확인하는 두 개의 병렬 lane입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">App과 CLI는 각자의 설치 표면에서 검증합니다</text><text x="70" y="110" class="body" font-size="20">marketplace와 plugin 선택자는 같지만, 설치 뒤 시작해야 하는 대화 surface가 다릅니다.</text>
  <g aria-label="읽기 순서 1: Codex App lane"><rect x="40" y="180" width="1320" height="252" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="198" width="150" height="42" rx="21" fill="var(--blue)"/><text x="139" y="219" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex App</text><rect x="260" y="270" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="390" y="315" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">Plugins 열기</text><text x="390" y="348" class="body" font-size="17" text-anchor="middle">Directory에서 설치</text><path d="M532 325H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="270" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="710" y="315" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">제품 선택</text><text x="710" y="348" class="body" font-size="17" text-anchor="middle">Studio 또는 Career</text><path d="M852 325H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="270" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="1030" y="315" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">새 채팅</text><text x="1030" y="348" class="body" font-size="17" text-anchor="middle">@plugin 선택 확인</text></g>
  <g aria-label="읽기 순서 2: Codex CLI lane"><rect x="40" y="500" width="1320" height="252" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="518" width="150" height="42" rx="21" fill="var(--purple)"/><text x="139" y="539" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex CLI</text><rect x="260" y="590" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="390" y="635" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">marketplace 추가</text><text x="390" y="668" class="body" font-size="17" text-anchor="middle">codex plugin marketplace add</text><path d="M532 645H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="590" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="710" y="635" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">plugin 추가</text><text x="710" y="668" class="body" font-size="17" text-anchor="middle">codex plugin add</text><path d="M852 645H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="590" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="1030" y="635" class="label" fill="#3c3489" font-size="23" text-anchor="middle" dominant-baseline="central">새 세션</text><text x="1030" y="668" class="body" font-size="17" text-anchor="middle">plugin list로 확인</text></g>
</svg>
