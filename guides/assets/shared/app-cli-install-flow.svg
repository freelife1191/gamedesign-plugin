<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">App과 CLI는 각자의 설치 표면에서 검증합니다</title><desc id="desc">설치 전에 marketplace JSON의 UTF-8 인코딩과 marketplace 종류를 확인한 뒤, Codex App과 Codex CLI에서 같은 plugin을 설치하되 App은 새 채팅, CLI는 새 세션으로 확인하는 흐름입니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">App과 CLI는 각자의 설치 표면에서 검증합니다</text><text x="70" y="110" class="body" font-size="20">marketplace와 plugin 선택자는 같지만, 설치 뒤 시작해야 하는 대화 surface가 다릅니다.</text>
  <g aria-label="읽기 순서 1: 설치 전 확인"><rect x="40" y="150" width="1320" height="140" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="168" width="216" height="42" rx="21" fill="var(--amber)"/><text x="172" y="189" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">설치 전 확인</text><rect x="320" y="176" width="480" height="96" rx="12" class="card" stroke="var(--amber)"/><text x="560" y="212" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">UTF-8 preflight</text><text x="560" y="246" class="body" font-size="17" text-anchor="middle">BOM 있는 marketplace JSON은 plugin list를 막습니다</text><rect x="840" y="176" width="480" height="96" rx="12" class="card" stroke="var(--amber)"/><text x="1080" y="212" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">마켓플레이스 종류</text><text x="1080" y="246" class="body" font-size="17" text-anchor="middle">Git는 공개 릴리스, 로컬은 checkout을 따릅니다</text></g>
  <path d="M700 298V322" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: Codex App lane"><rect x="40" y="334" width="1320" height="232" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="352" width="150" height="42" rx="21" fill="var(--blue)"/><text x="139" y="373" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex App</text><rect x="260" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="390" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">Plugins 열기</text><text x="390" y="492" class="body" font-size="17" text-anchor="middle">Directory에서 설치</text><path d="M532 469H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="710" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">제품 선택</text><text x="710" y="492" class="body" font-size="17" text-anchor="middle">Studio 또는 Career</text><path d="M852 469H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="1030" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">새 채팅</text><text x="1030" y="492" class="body" font-size="17" text-anchor="middle">@plugin 선택 확인</text></g>
  <g aria-label="읽기 순서 3: Codex CLI lane"><rect x="40" y="602" width="1320" height="232" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="620" width="150" height="42" rx="21" fill="var(--purple)"/><text x="139" y="641" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex CLI</text><rect x="260" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="390" y="727" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">marketplace 추가</text><text x="390" y="760" class="body" font-size="17" text-anchor="middle">codex plugin marketplace add</text><path d="M532 737H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="710" y="727" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">plugin 추가</text><text x="710" y="760" class="body" font-size="17" text-anchor="middle">codex plugin add</text><path d="M852 737H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="1030" y="727" class="label" fill="#3c3489" font-size="23" text-anchor="middle" dominant-baseline="central">새 세션</text><text x="1030" y="760" class="body" font-size="17" text-anchor="middle">plugin list로 확인</text></g>
</svg>
