<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">App과 CLI 모두 설치부터 전체 정리까지 확인합니다</title><desc id="desc">설치 전에 마켓플레이스 설정 파일의 UTF-8 인코딩과 유형을 확인한 뒤 Codex App과 Codex CLI에서 같은 플러그인을 설치합니다. Windows와 Ubuntu에서는 제품 하나만 제거했다가 다시 설치하는 과정과 전체 정리 뒤 남은 목록·캐시까지 확인합니다.</desc>
  <style>svg{--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--blue:#1f6fb2;--purple:#534ab7;--amber:#a4661a}.title{fill:var(--ink);font-weight:700}.body{fill:var(--muted)}.on-accent{fill:#fff}.line{stroke:#5b6675;stroke-width:2;fill:none}.card{fill:#fff;stroke-width:1.5}.label{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5b6675" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="1400" height="900" fill="#fff"/><rect x="40" y="48" width="6" height="72" rx="3" fill="var(--blue)"/><text x="70" y="74" class="title" font-size="42">App과 CLI 모두 설치부터 전체 정리까지 확인합니다</text><text x="70" y="110" class="body" font-size="20">Windows와 Ubuntu에서 설치, 일부 제거, 재설치, 전체 정리와 새 세션 시작을 확인합니다.</text>
  <g aria-label="읽기 순서 1: 설치 전 확인"><rect x="40" y="150" width="1320" height="140" rx="20" fill="#fbf7f1" stroke="var(--hair)"/><rect x="64" y="168" width="216" height="42" rx="21" fill="var(--amber)"/><text x="172" y="189" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">설치 전 확인</text><rect x="320" y="176" width="480" height="96" rx="12" class="card" stroke="var(--amber)"/><text x="560" y="212" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">UTF-8 사전 확인</text><text x="560" y="246" class="body" font-size="17" text-anchor="middle">BOM이 있으면 설치 목록을 읽지 못할 수 있습니다</text><rect x="840" y="176" width="480" height="96" rx="12" class="card" stroke="var(--amber)"/><text x="1080" y="212" class="label" fill="#7a4a10" font-size="22" text-anchor="middle" dominant-baseline="central">마켓플레이스 유형</text><text x="1080" y="246" class="body" font-size="17" text-anchor="middle">Git은 공개 릴리스, 로컬은 현재 작업본을 따릅니다</text></g>
  <path d="M700 298V322" class="line" marker-end="url(#arrow)"/>
  <g aria-label="읽기 순서 2: Codex App 설치 경로"><rect x="40" y="334" width="1320" height="232" rx="20" fill="#f4f8fc" stroke="var(--hair)"/><rect x="64" y="352" width="150" height="42" rx="21" fill="var(--blue)"/><text x="139" y="373" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex App</text><rect x="260" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="390" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">플러그인 목록 열기</text><text x="390" y="492" class="body" font-size="17" text-anchor="middle">Directory 메뉴에서 설치</text><path d="M532 469H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="710" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">제품 선택</text><text x="710" y="492" class="body" font-size="17" text-anchor="middle">Studio 또는 Career</text><path d="M852 469H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="414" width="260" height="110" rx="12" class="card" stroke="var(--blue)"/><text x="1030" y="459" class="label" fill="#124267" font-size="23" text-anchor="middle" dominant-baseline="central">확인·제거</text><text x="1030" y="492" class="body" font-size="17" text-anchor="middle">새 채팅에서 확인한 뒤 제거</text></g>
  <g aria-label="읽기 순서 3: Codex CLI 설치 경로"><rect x="40" y="602" width="1320" height="232" rx="20" fill="#f7f5fc" stroke="var(--hair)"/><rect x="64" y="620" width="150" height="42" rx="21" fill="var(--purple)"/><text x="139" y="641" class="on-accent" font-size="18" text-anchor="middle" dominant-baseline="central">Codex CLI</text><rect x="260" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="390" y="727" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">마켓플레이스 추가</text><text x="390" y="760" class="body" font-size="17" text-anchor="middle">codex plugin marketplace add</text><path d="M532 737H568" class="line" marker-end="url(#arrow)"/><rect x="580" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="710" y="727" class="label" fill="#3c3489" font-size="22" text-anchor="middle" dominant-baseline="central">설치·재설치</text><text x="710" y="760" class="body" font-size="17" text-anchor="middle">codex plugin add</text><path d="M852 737H888" class="line" marker-end="url(#arrow)"/><rect x="900" y="682" width="260" height="110" rx="12" class="card" stroke="var(--purple)"/><text x="1030" y="727" class="label" fill="#3c3489" font-size="20" text-anchor="middle" dominant-baseline="central">선택 제거·전체 정리</text><text x="1030" y="760" class="body" font-size="17" text-anchor="middle">두 목록·제품 캐시 확인</text></g>
</svg>
