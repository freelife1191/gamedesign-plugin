<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="라이브 서비스 RPG 경제 루프와 롤백 흐름" viewBox="0 0 960 540">
  <title>라이브 서비스 RPG 경제 루프와 롤백 흐름</title><desc>일일 미션, 소프트 재화, 업그레이드의 경제 루프와 주간 인플레이션 가드레일 및 자동 롤백을 보여준다.</desc><rect width="960" height="540" fill="#f8fafc"/>
  <g font-family="D2Coding" fill="#0f172a"><text x="56" y="68" font-size="30" font-weight="700">경제 루프와 안전장치</text><text x="56" y="100" font-size="16" fill="#475569">목표 보유량 5,000 · 단일 변수 실험</text></g>
  <g font-family="D2Coding" fill="#0f172a"><rect x="56" y="160" width="220" height="112" rx="16" fill="#dbeafe" stroke="#2563eb"/><text x="82" y="208" font-size="21">일일 미션</text><text x="82" y="238" font-size="15">공급원</text><rect x="370" y="160" width="220" height="112" rx="16" fill="#e0f2fe" stroke="#0284c7"/><text x="396" y="208" font-size="21">소프트 재화</text><text x="396" y="238" font-size="14">기준 5,000</text><rect x="684" y="160" width="220" height="112" rx="16" fill="#dcfce7" stroke="#16a34a"/><text x="710" y="208" font-size="21">업그레이드</text><text x="710" y="238" font-size="15">소비처</text></g>
  <g stroke="#334155" stroke-width="4" fill="none"><path d="M276 216H360"/><path d="M590 216H674"/><path d="M794 282V318H166V282"/></g><rect x="56" y="372" width="848" height="112" rx="14" fill="#fff7ed" stroke="#ea580c"/><g font-family="D2Coding" fill="#7c2d12"><text x="82" y="416" font-size="21" font-weight="700">주간 인플레이션율 위반</text><text x="82" y="451" font-size="17">자동 롤백 → 마지막 정상 설정 복구 → 원장 정합성 확인 및 알림</text></g>
