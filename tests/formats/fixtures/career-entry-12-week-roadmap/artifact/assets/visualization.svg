<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="입문 게임 디자이너 12주 증거 로드맵" viewBox="0 0 960 540">
  <title>입문 게임 디자이너 12주 증거 로드맵</title><desc>주 8시간의 12주 과정에서 역할 후보, 증거 공백, 첫 포트폴리오 브리프를 연결한다.</desc><rect width="960" height="540" fill="#f8fafc"/>
  <g font-family="D2Coding" fill="#0f172a"><text x="56" y="68" font-size="30" font-weight="700">12주 · 주 8시간 · 증거 중심</text><text x="56" y="100" font-size="16" fill="#475569">성과는 관찰 전까지 주장하지 않는다</text></g>
  <g font-family="D2Coding" fill="#0f172a"><rect x="56" y="148" width="250" height="126" rx="16" fill="#dbeafe" stroke="#2563eb"/><text x="80" y="190" font-size="22" font-weight="700">역할 후보 2개</text><text x="80" y="226" font-size="17">시스템 디자인</text><text x="80" y="254" font-size="17">콘텐츠 디자인</text><rect x="355" y="148" width="250" height="126" rx="16" fill="#fef3c7" stroke="#d97706"/><text x="379" y="190" font-size="22" font-weight="700">증거 공백 2개</text><text x="379" y="226" font-size="17">규칙과 예외</text><text x="379" y="254" font-size="17">플레이테스트 학습</text><rect x="654" y="148" width="250" height="126" rx="16" fill="#dcfce7" stroke="#16a34a"/><text x="678" y="190" font-size="22" font-weight="700">첫 브리프</text><text x="678" y="226" font-size="17">상태표 + 3회 관찰</text><text x="678" y="254" font-size="17">결과: 증거 대기</text></g>
