name: Release note gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate versioned release notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            npm run validate:release-notes -- --tag "$RELEASE_TAG"
          else
            npm run validate:release-notes
          fi
