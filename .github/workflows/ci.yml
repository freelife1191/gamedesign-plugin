name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run it replaces; keeping the old one alive only burns runner minutes on a
# tree nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both operating systems. The Windows offline lane was built, run, read, removed, and is now back: the
  # 272 failing assertions it reported were three different problems, not one. The two defects in shipped
  # code went first — the no-follow flag and the directory fsync now go through
  # shared/scripts/lib/platform-file-hardening.mjs, which names win32 as the one platform exempt from each
  # and keeps every other host failing closed. Addressed here is the second class, the class this lane was
  # withdrawn for: POSIX assumptions in the tests and tooling themselves. A hardcoded /bin/sh, a /tmp that
  # is not a path on Windows, a fabricated program with a shebang that Windows cannot execute, a
  # chmod-based assertion where chmod is a no-op. Each of those now goes through
  # tests/lib/platform-support.mjs, which either supplies the platform's own spelling for the thing or
  # declines the case by name — never by quietly passing.
  #
  # A lane that cannot fail is not a gate, so this one gates. Every fix above is reasoned from what Windows
  # does differently and the POSIX side is proven, but this lane running on Windows IS the Windows verdict
  # and it has not returned one yet. A failure it reports on its first runs is a class that was not on the
  # list, not a regression: the list lives in architecture/plugin-suite.md and that is where the row goes.
  # The format smoke and the render drift are skipped here on every platform and are not covered either way.
  #
  # The narrow Windows hardening gate below stays separate on purpose — it is the floor that must hold
  # whatever this lane is doing, and it would be worth nothing if it lived inside the lane it outlives.
  offline-gate:
    name: Offline gate (${{ matrix.shard }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # One shard, not the whole suite, so the ceiling is a third of what a single-queue run needed. Loose
    # enough for an honest run on a shared runner, tight enough that a hang fails in minutes not hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        # Four jobs instead of one queue. The three test stages are three quarters of the run and have
        # nothing to say to each other, so serialising them only spent wall clock. `validate-suite.mjs`
        # owns the partition and a unit test holds it to covering every stage exactly once, which is what
        # keeps a shard split from quietly becoming a stage nobody runs.
        shard:
          - checks
          - unit
          - contracts
          - products
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Several contract tests validate their specs against a real Archify CLI resolved from the host.
      # This puts the copy this repository already vendors, and verifies by hash in the same run, where
      # the resolver looks — so the contracts assert against the real tool rather than being weakened.
      # bash on both runners, not because the step needs a shell but because the two default shells quote
      # differently and the argument below contains spaces. One shell means one quoting rule to reason about.
      - name: Stage the vendored Archify CLI as a host skill
        shell: bash
        run: node tooling/stage-host-archify.mjs
      # Four stages cannot run here. The official plugin and skill validators ship with a Codex install.
      # The format smoke imports a host-provided module that is not a dependency of this package. The
      # diagram render drift compares PNG bytes produced by a headless Chromium against the host's fonts,
      # so it only means anything on the machine whose renderer committed them. validate-suite records
      # all four as SKIPPED, so a green run here is never read as a full one.
      - name: Validate suite
        shell: bash
        run: >-
          node tooling/validate-suite.mjs
          --shard ${{ matrix.shard }}
          --skip "official plugin validators"
          --skip "skill quick validators"
          --skip "diagram render drift"
          --skip "format smoke"
      - name: Note the stages CI could not run
        if: always()
        shell: bash
        run: |
          {
            echo "### Skipped here, run locally before release"
            echo ""
            echo "- official plugin validators"
            echo "- skill quick validators"
            echo "- diagram render drift"
            echo "- format smoke"
          } >> "$GITHUB_STEP_SUMMARY"

  # The narrow Windows lane. The two shipped defects that used to break design memory and image config on
  # Windows are fixed, and the fix is one module — shared/scripts/lib/platform-file-hardening.mjs — that
  # names win32 as the single platform exempt from the no-follow flag, the directory fsync, and the POSIX
  # permission bits. Its own suite drives that module with Windows inputs on any host, which is what makes
  # it safe to run everywhere; running it HERE is what turns "Windows-shaped input" into "ran on Windows".
  # This lane is deliberately one file, and stays one file now that the offline gate covers Windows too.
  # Its value is exactly that it does not depend on the whole suite being Windows-clean: whatever the broad
  # lane reports on any given day, the platform exemptions the products ship with keep their own Windows
  # evidence. One file that always runs is worth more here than the same file inside a suite that might not.
  windows-hardening-gate:
    name: Windows hardening gate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The raw node test runner over one file: no shard, no stage accounting, nothing that could turn a
      # miss into a recorded skip. If the file stops existing the step fails.
      - name: Prove the platform exemptions on a real Windows host
        run: node --test tests/unit/platform-file-hardening.test.mjs

  # Both operating systems, and Windows is the point of it. This is the lane that proves the spec's Windows
  # contract: that a checkout and install on Windows yields the same bytes the other platforms yield.
  install-gate:
    name: Install gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installed into a directory we name rather than globally, so the JavaScript entry point is at a
      # path that is identical on every runner. A global install would leave only a launcher, and on
      # Windows that launcher is a .cmd shim, which Node refuses to spawn without a shell — and a shell
      # would have to re-quote the Hangul, space-containing paths this gate exists to exercise.
      - name: Install the Codex CLI
        run: npm install --no-save --no-fund --no-audit --prefix .codex-cli @openai/codex
      # No model is called, so no credential is needed and none is provided. The round trip installs
      # both products under a Hangul, space-containing CODEX_HOME and workspace, then compares the
      # installed bytes against the source. --require-codex turns a missing CLI into a failure rather
      # than a silent skip, because here the CLI was just installed and its absence is a real fault.
      - name: Install round trip
        run: >-
          node tooling/install-roundtrip.mjs --require-codex
          --codex .codex-cli/node_modules/@openai/codex/bin/codex.js
