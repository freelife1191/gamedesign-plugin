name: Check bundled skill updates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check trusted bundled releases
        run: |
          summary="$(mktemp)"
          trap 'rm -f "$summary"' EXIT
          set +e
          node tooling/check-suite-updates.mjs > "$summary"
          status=$?
          set -e
          # An available upstream release is a recommendation, not a build break: nothing in the tree is
          # wrong, and the decision to vendor a new version belongs to a person running the upgrade
          # locally. Only an unresolved check (exit 1) fails, because that is the case where the audit
          # did not actually answer the question it was scheduled to answer.
          advisory="$(node tooling/update-vendors.mjs --report --from "$summary" || true)"
          {
            echo "## Bundled skill update audit"
            echo ""
            echo "$advisory"
            echo ""
            echo "적용은 저장소에서 \`npm run update:vendors\` 를 실행해 승인한 뒤에만 이루어집니다. 이 작업은 아무것도 바꾸지 않습니다."
            echo ""
            echo '```json'
            cat "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
